<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#120821; --ink2:#1B0F33; --ink3:#251543;
    --nyellow:#FFD54A; --nviolet:#B26CFF; --norange:#FF7A3D; --nblue:#4FC3F7; --nred:#FF4D5A; --nmint:#4DE6A8;
    --cream:#FFF4E0; --muted:#8E7FA8; --line:rgba(178,108,255,.35);
    --sans:'Bebas Neue','Arial Narrow',Arial,sans-serif;
    --serif:'Lora',Georgia,serif;
    /* rétro-compat */
    --stage:var(--ink); --panel:var(--ink2); --panel2:var(--ink3);
    --gold:var(--nyellow); --magenta:var(--norange); --cyan:var(--nblue); --red:var(--nred); --dim:var(--muted);
    --plum:var(--ink); --plum2:var(--ink2); --plum3:var(--ink3); --mustard:var(--nyellow);
    --perk:var(--norange); --logoblue:var(--nblue); --brick:var(--nred); --mint:var(--nmint); --cream2:#D8CBB6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink);
    background-image:radial-gradient(ellipse 120% 70% at 50% -10%, #2A1550 0%, var(--ink) 60%),
                     radial-gradient(ellipse 80% 40% at 50% 115%, rgba(178,108,255,.14) 0%, transparent 60%);
    color:var(--cream);font-family:var(--serif);min-height:100vh;padding-bottom:110px;position:relative;overflow-x:hidden}
  /* scanlines CRT */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.10;
    background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.6) 2px 3px)}
  /* vignette */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 105% 90% at 50% 45%, transparent 55%, rgba(6,2,14,.55) 100%)}
  header,#podiums,#stage,#logwrap{position:relative;z-index:3}

  /* ---------- enseigne ---------- */
  header{padding:6px 16px 4px;text-align:center}
  header h1{font-family:'Monoton',var(--sans);font-weight:400;font-size:clamp(30px,8.6vw,48px);letter-spacing:.1em;line-height:1;color:var(--nyellow);
    text-shadow:0 0 6px rgba(255,213,74,.9),0 0 18px rgba(255,213,74,.6),0 0 42px rgba(255,170,40,.45),0 0 80px rgba(255,150,30,.3);
    animation:signflick 9s linear infinite}
  @keyframes signflick{
    0%,6.9%,7.3%,52%,53.4%,100%{opacity:1}
    7%,7.2%{opacity:.55}
    52.6%,53.2%{opacity:.7}
    52.8%{opacity:.4}}
  header h1 .flicko{cursor:pointer;-webkit-tap-highlight-color:transparent;animation:brokenO 4.6s linear infinite;display:inline-block}
  @keyframes brokenO{
    0%,8%,12%,58%,64%,100%{opacity:1;text-shadow:inherit}
    9%,11%{opacity:.12;text-shadow:none}
    10%{opacity:.5}
    59%,61%,63%{opacity:.18;text-shadow:none}
    60%,62%{opacity:.75}}
  .dots{display:flex;justify-content:center;gap:10px;margin:10px 0 5px}
  .dots i{width:7px;height:7px;border-radius:50%;display:block;animation:chase 2.4s linear infinite}
  .dots i:nth-child(1){background:var(--nred);box-shadow:0 0 8px var(--nred);animation-delay:0s}
  .dots i:nth-child(2){background:var(--nblue);box-shadow:0 0 8px var(--nblue);animation-delay:.4s}
  .dots i:nth-child(3){background:var(--nyellow);box-shadow:0 0 8px var(--nyellow);animation-delay:.8s}
  .dots i:nth-child(4){background:var(--nmint);box-shadow:0 0 8px var(--nmint);animation-delay:1.2s}
  .dots i:nth-child(5){background:var(--norange);box-shadow:0 0 8px var(--norange);animation-delay:1.6s}
  .dots i:nth-child(6){background:var(--cream);box-shadow:0 0 8px var(--cream);animation-delay:2s}
  @keyframes chase{0%,70%,100%{opacity:.35;transform:scale(1)}80%{opacity:1;transform:scale(1.5)}90%{opacity:.6}}
  header .sub{color:var(--nviolet);font-family:var(--sans);font-size:13px;letter-spacing:.32em;margin-top:3px;text-transform:uppercase;
    text-shadow:0 0 8px rgba(178,108,255,.8),0 0 20px rgba(178,108,255,.4)}

  /* ---------- podiums ---------- */
  #podiums{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;padding:10px 12px}
  #podiums.n5{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
  #podiums.n5 .pod{padding:8px 5px 6px}
  #podiums.n5 .pod .nm{font-size:13px;letter-spacing:.05em}
  #podiums.n5 .pod .sc{font-size:28px}
  #podiums.n5 .bdg{font-size:10px;padding:0 5px}
  #podiums.n9{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
  #podiums.n9 .pod{padding:6px 4px 5px;border-radius:10px}
  #podiums.n9 .pod .nm{font-size:11px;letter-spacing:.03em}
  #podiums.n9 .pod .sc{font-size:22px}
  #podiums.n9 .fx-pts{font-size:19px;top:18px}
  .pod{min-width:0;background:rgba(27,15,51,.72);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px 8px;text-align:center;position:relative;cursor:pointer;
    box-shadow:0 0 14px rgba(178,108,255,.12), inset 0 0 18px rgba(178,108,255,.06);transition:transform .15s,border-color .15s,box-shadow .2s}
  .pod.active{border-color:var(--nyellow);box-shadow:0 0 18px rgba(255,213,74,.35), inset 0 0 20px rgba(255,213,74,.08);transform:translateY(-2px)}
  .pod.active::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--nyellow);
    box-shadow:0 0 10px var(--nyellow);animation:dotblink 1.1s steps(2,start) infinite}
  @keyframes dotblink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  .pod .nm{font-family:var(--sans);font-size:16px;letter-spacing:.1em;color:var(--cream2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .sc{font-family:var(--sans);font-size:38px;color:var(--nyellow);line-height:1.05;margin-top:2px;
    text-shadow:0 0 6px rgba(255,213,74,.8),0 0 18px rgba(255,213,74,.4)}
  .pod.active .sc{color:var(--cream);text-shadow:0 0 6px rgba(255,244,224,.9),0 0 20px rgba(255,213,74,.7);animation:buzz 3.4s linear infinite}
  @keyframes buzz{0%,91%,94%,100%{transform:none;opacity:1}92%{transform:translateX(.6px);opacity:.85}93%{transform:translateX(-.6px)}}
  .badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:18px;margin-top:5px}
  .bdg{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--cream2)}
  .bdg.gold{border-color:var(--nmint);color:var(--nmint);text-shadow:0 0 6px rgba(77,230,168,.7)}
  .bdg.cy{border-color:var(--nblue);color:var(--nblue);text-shadow:0 0 6px rgba(79,195,247,.7)}
  .bdg.mg{border-color:var(--norange);color:var(--norange);text-shadow:0 0 6px rgba(255,122,61,.7)}
  .bdg.rd{border-color:var(--nred);color:var(--nred);text-shadow:0 0 6px rgba(255,77,90,.7)}

  /* ---------- scène ---------- */
  #stage{padding:6px 14px 14px;max-width:560px;margin:0 auto}
  .card{background:rgba(27,15,51,.78);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:10px;
    box-shadow:0 0 22px rgba(178,108,255,.16), inset 0 0 26px rgba(178,108,255,.05);animation:breathe 5s ease-in-out infinite alternate}
  @keyframes breathe{from{box-shadow:0 0 16px rgba(178,108,255,.12), inset 0 0 22px rgba(178,108,255,.04)}to{box-shadow:0 0 28px rgba(178,108,255,.24), inset 0 0 30px rgba(178,108,255,.08)}}
  .eyebrow{color:var(--nblue);font-family:var(--sans);font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px;
    text-shadow:0 0 8px rgba(79,195,247,.65)}
  .qtext{font-size:20px;font-weight:600;line-height:1.4;font-family:var(--serif)}
  .atext{margin-top:12px;color:var(--nyellow);font-size:18px;font-weight:600;font-style:italic;text-shadow:0 0 10px rgba(255,213,74,.55);animation:apop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes apop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .cardtitle{font-family:var(--sans);font-size:30px;letter-spacing:.08em;text-transform:uppercase;line-height:1.05;color:var(--cream);
    text-shadow:0 0 10px rgba(255,244,224,.5),0 0 26px rgba(178,108,255,.5)}
  .cardtxt{margin-top:10px;font-size:16px;line-height:1.5}
  .hint{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.45;font-style:italic}

  .btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{flex:1;min-width:120px;background:rgba(18,8,33,.65);border:2px solid;border-radius:12px;padding:13px 12px;
    font-family:var(--sans);letter-spacing:.12em;font-size:18px;text-transform:uppercase;cursor:pointer;line-height:1;
    transition:transform .08s,box-shadow .2s;animation:btnhum 4.2s ease-in-out infinite alternate}
  @keyframes btnhum{from{filter:brightness(.96)}to{filter:brightness(1.08)}}
  button:active{transform:scale(.97)}
  .b-gold{border-color:var(--nyellow);color:var(--nyellow);text-shadow:0 0 8px rgba(255,213,74,.8);box-shadow:0 0 14px rgba(255,213,74,.35), inset 0 0 12px rgba(255,213,74,.12)}
  .b-mg{border-color:var(--norange);color:var(--norange);text-shadow:0 0 8px rgba(255,122,61,.8);box-shadow:0 0 14px rgba(255,122,61,.32), inset 0 0 12px rgba(255,122,61,.12)}
  .b-cy{border-color:var(--nblue);color:var(--nblue);text-shadow:0 0 8px rgba(79,195,247,.8);box-shadow:0 0 14px rgba(79,195,247,.32), inset 0 0 12px rgba(79,195,247,.12)}
  .b-rd{border-color:var(--nred);color:var(--nred);text-shadow:0 0 8px rgba(255,77,90,.8);box-shadow:0 0 14px rgba(255,77,90,.32), inset 0 0 12px rgba(255,77,90,.12)}
  .b-ghost{border-color:rgba(178,108,255,.4);color:var(--cream2);animation:none;box-shadow:none;text-shadow:none}
  .b-sm{flex:1 1 auto;min-width:0;padding:10px 14px;font-size:15px;white-space:normal}
  .b-xs{flex:0 0 auto;min-width:0;padding:7px 10px;font-size:13px}

  /* ---------- dés ---------- */
  .dicewrap{display:flex;gap:16px;justify-content:center;margin:18px 0 6px}
  .die{width:64px;height:64px;border-radius:12px;background:rgba(18,8,33,.7);border:2px solid var(--cream);color:var(--cream);
    display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:36px;
    text-shadow:0 0 10px rgba(255,244,224,.8);box-shadow:0 0 16px rgba(255,244,224,.3), inset 0 0 12px rgba(255,244,224,.1)}
  .die.rolling{animation:shake .12s infinite}
  @keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
  .wheelres{margin-top:8px;text-align:center}
  .wheelres .big{font-family:var(--sans);font-size:28px;color:var(--norange);letter-spacing:.08em;text-transform:uppercase;
    text-shadow:0 0 10px rgba(255,122,61,.8),0 0 26px rgba(255,122,61,.4)}

  /* ---------- timer ---------- */
  .timer{font-family:var(--sans);font-size:56px;text-align:center;color:var(--nblue);margin:8px 0;font-variant-numeric:tabular-nums;letter-spacing:.06em;
    text-shadow:0 0 10px rgba(79,195,247,.85),0 0 30px rgba(79,195,247,.45)}
  .timer.hot{color:var(--nred);text-shadow:0 0 10px rgba(255,77,90,.9),0 0 32px rgba(255,77,90,.5);animation:pulse .5s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;background:rgba(10,4,20,.94);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:20px;padding:20px;text-align:center}
  #overlay.show{display:flex}
  .stamp{font-family:var(--sans);font-size:clamp(40px,12vw,76px);color:var(--nred);letter-spacing:.08em;line-height:1;text-transform:uppercase;
    border:4px solid var(--nred);border-radius:8px;padding:12px 24px 8px;transform:rotate(-7deg);
    text-shadow:0 0 8px rgba(255,77,90,.9),0 0 24px rgba(255,77,90,.55),0 0 52px rgba(255,77,90,.35);
    box-shadow:0 0 24px rgba(255,77,90,.4), inset 0 0 20px rgba(255,77,90,.15);
    animation:stampin .28s cubic-bezier(.2,1.6,.4,1),stglitch 2.6s steps(1) .5s infinite}
  .stamp.mk{color:var(--nyellow);border-color:var(--nyellow);
    text-shadow:0 0 8px rgba(255,213,74,.9),0 0 24px rgba(255,213,74,.55),0 0 52px rgba(255,213,74,.35);
    box-shadow:0 0 24px rgba(255,213,74,.4), inset 0 0 20px rgba(255,213,74,.15)}
  @keyframes stampin{from{transform:rotate(-7deg) scale(2.6);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
  @keyframes stglitch{0%,90%,100%{transform:rotate(-7deg)}91%{transform:rotate(-7deg) translateX(3px)}92%{transform:rotate(-7deg) translateX(-2px);opacity:.7}93%{transform:rotate(-7deg)}}
  #overlay .sub2{font-size:17px;color:var(--cream2);max-width:420px;line-height:1.5}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(10,4,20,.9);display:none;align-items:flex-end;justify-content:center;z-index:60}
  #modal.show{display:flex}
  #modal .sheet{background:var(--ink2);border-top:2px solid var(--nyellow);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:20px 16px 26px;
    box-shadow:0 -6px 30px rgba(255,213,74,.15)}
  #modal h3{font-family:var(--sans);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:22px;margin-bottom:12px;color:var(--cream);
    text-shadow:0 0 12px rgba(178,108,255,.6)}
  .mrow{display:flex;flex-direction:column;gap:8px}
  .mrow button{min-width:0}

  /* ---------- journal ---------- */
  #logwrap{position:fixed;bottom:0;left:0;right:0;background:rgba(18,8,33,.96);border-top:1.5px solid var(--line);padding:8px 14px 10px;max-height:36px;overflow:hidden;z-index:40;cursor:pointer;transition:max-height .2s;
    box-shadow:0 -4px 24px rgba(178,108,255,.15)}
  #logwrap.open{max-height:180px;overflow-y:auto}
  #logwrap::before{content:"▮ " attr(data-closed);display:block;font-family:var(--sans);font-size:11px;color:var(--nviolet);letter-spacing:.22em;margin-bottom:5px;
    text-shadow:0 0 8px rgba(178,108,255,.7);animation:cursorblink 1.2s steps(2,start) infinite}
  #logwrap.open::before{content:"▮ " attr(data-open)}
  @keyframes cursorblink{50%{opacity:.55}}
  #logwrap .lg{font-size:12.5px;color:var(--muted);line-height:1.5}
  #logwrap .lg b{color:var(--cream2)}
  #logwrap .lg:first-child{color:var(--cream)}
  #logwrap .lg:first-child b{color:var(--nyellow);text-shadow:0 0 6px rgba(255,213,74,.6)}
  .dare{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(37,21,67,.85);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px;line-height:1.35}
  .dare .dbt{display:flex;gap:5px;flex:0 0 auto}

  /* ---------- animations d'événements ---------- */
  .evt{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
  .evt-ico{font-size:84px;line-height:1;filter:drop-shadow(0 0 18px rgba(178,108,255,.7))}
  .evt-title{font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase;font-size:clamp(30px,8vw,52px);color:var(--nyellow);
    text-shadow:0 0 8px rgba(255,213,74,.9),0 0 26px rgba(255,213,74,.5),0 0 60px rgba(255,170,40,.35);
    animation:titlein .5s cubic-bezier(.2,1.6,.4,1) .25s both,signflick 7s linear 1.2s infinite}
  @keyframes titlein{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .evt.climb .evt-ico{animation:climb .9s cubic-bezier(.3,1.4,.4,1) both}
  @keyframes climb{0%{transform:translateY(90px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
  .evt.pond .evt-ico{animation:splash .8s ease-out both}
  @keyframes splash{0%{transform:translateY(-110px) scale(.5);opacity:0}60%{transform:translateY(0) scale(1.06);opacity:1}100%{transform:scale(1)}}
  .evt.pond::before,.evt.pond::after{content:"";position:absolute;top:8px;left:50%;width:110px;height:110px;margin-left:-55px;border:2px solid var(--nmint);border-radius:50%;opacity:0;
    box-shadow:0 0 12px rgba(77,230,168,.6);animation:ripple 1.6s ease-out .5s infinite}
  .evt.pond::after{animation-delay:1.1s}
  @keyframes ripple{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
  .evt.spin .evt-ico{animation:evspin .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes evspin{from{transform:rotate(-360deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
  .evt.pop .evt-ico{animation:evpop .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes evpop{from{transform:scale(0)}to{transform:scale(1)}}
  .evt.shake .evt-ico{animation:evshake .4s ease-in-out 2}
  @keyframes evshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .evt.glow .evt-ico{animation:glow 1.1s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.7;filter:drop-shadow(0 0 8px rgba(178,108,255,.5))}to{opacity:1;filter:drop-shadow(0 0 28px rgba(255,213,74,.9))}}
  .confetti{position:absolute;top:-20px;width:8px;height:14px;opacity:.95;animation:fall linear forwards;pointer-events:none;border-radius:1px;box-shadow:0 0 6px currentColor}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.5}}


  /* ============ ANIMATIONS PLATEAU TÉLÉ ============ */
  /* rampe d'ampoules qui court en haut de la carte active */
  .card.live{position:relative;overflow:hidden}
  .card.live::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:repeating-linear-gradient(90deg,var(--nyellow) 0 8px,transparent 8px 22px);
    background-size:22px 3px;filter:drop-shadow(0 0 5px var(--nyellow));
    animation:marquee 1.1s linear infinite;opacity:.85}
  @keyframes marquee{to{background-position:22px 0}}

  /* balayage de projecteur sur la carte de question */
  .card.live::after{content:"";position:absolute;top:-60%;left:-40%;width:45%;height:220%;
    background:linear-gradient(105deg,transparent,rgba(255,244,224,.09),transparent);
    transform:rotate(8deg);animation:sweep 5.5s ease-in-out infinite;pointer-events:none}
  @keyframes sweep{0%{left:-45%}55%,100%{left:125%}}

  /* entrée de plateau : la carte descend comme un panneau de décor */
  .drop-in{animation:dropIn .38s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes dropIn{from{transform:translateY(-18px) scale(.97);opacity:0}to{transform:none;opacity:1}}

  /* podium : flash de gain / de perte */
  .pod.win{animation:podWin .7s ease-out}
  .pod.lose{animation:podLose .7s ease-out}
  @keyframes podWin{0%{box-shadow:0 0 0 rgba(255,213,74,0)}25%{box-shadow:0 0 34px rgba(255,213,74,.95),inset 0 0 26px rgba(255,213,74,.4);transform:translateY(-5px) scale(1.03)}100%{box-shadow:0 0 14px rgba(178,108,255,.12)}}
  @keyframes podLose{0%{box-shadow:0 0 0 rgba(255,77,90,0)}20%{box-shadow:0 0 30px rgba(255,77,90,.9),inset 0 0 22px rgba(255,77,90,.35);transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{box-shadow:0 0 14px rgba(178,108,255,.12);transform:none}}

  /* jeton de points qui s'envole du podium */
  .fx-pts{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:9;
    font-family:var(--sans);font-size:26px;letter-spacing:.06em;pointer-events:none;white-space:nowrap;
    animation:ptsUp 1.15s cubic-bezier(.2,.9,.3,1) forwards}
  .fx-pts.up{color:var(--nyellow);text-shadow:0 0 10px rgba(255,213,74,.95),0 0 26px rgba(255,213,74,.6)}
  .fx-pts.down{color:var(--nred);text-shadow:0 0 10px rgba(255,77,90,.95),0 0 26px rgba(255,77,90,.6)}
  @keyframes ptsUp{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.6)}
    22%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.18)}
    38%{transform:translateX(-50%) translateY(0) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(.95)}}

  /* rampe de spots au-dessus du plateau (overlay d'événement) */
  #overlay.show::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 200deg at 50% -10%, transparent 0deg, rgba(255,213,74,.12) 18deg, transparent 36deg,
      transparent 60deg, rgba(79,195,247,.10) 78deg, transparent 96deg,
      transparent 120deg, rgba(255,122,61,.10) 138deg, transparent 156deg);
    animation:spots 6s linear infinite}
  @keyframes spots{to{transform:rotate(360deg)}}

  /* applaudimètre : barres qui montent sous les gros événements */
  .meter{display:flex;gap:4px;align-items:flex-end;height:26px;margin-top:-4px}
  .meter i{display:block;width:5px;background:var(--nyellow);border-radius:2px;box-shadow:0 0 8px var(--nyellow);
    animation:vu .55s ease-in-out infinite alternate}
  @keyframes vu{from{height:5px;opacity:.5}to{height:26px;opacity:1}}

  /* barre supérieure */
  .topbar{position:relative;z-index:4;display:flex;justify-content:flex-end;gap:8px;padding:10px 12px 0;max-width:560px;margin:0 auto}
  .topbar button{flex:0 0 auto;min-width:0;padding:6px 12px;font-size:13px}

  /* ============ FIN DE TOUR : LE SINGE-FUSÉE ============ */
  #turnend{position:fixed;inset:0;z-index:89;display:none;overflow:hidden;
    background:radial-gradient(ellipse 90% 70% at 50% 60%, rgba(58,26,110,.97) 0%, rgba(12,4,26,.99) 70%)}
  #turnend.show{display:block;animation:teIn .25s ease-out}
  @keyframes teIn{from{opacity:0}to{opacity:1}}
  /* rayons de projecteur qui tournent derrière */
  #turnend .rays{position:absolute;left:50%;top:52%;width:200vmax;height:200vmax;
    margin:-100vmax 0 0 -100vmax;opacity:0;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,213,74,.14) 0deg 9deg, transparent 9deg 22deg);
    animation:teRays 5s linear infinite, teRaysIn .6s ease-out .45s forwards}
  @keyframes teRays{to{transform:rotate(360deg)}}
  @keyframes teRaysIn{to{opacity:1}}
  /* onde de choc à l'arrivée */
  #turnend .shock{position:absolute;left:50%;top:56%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;border:4px solid var(--nyellow);opacity:0}
  #turnend .shock.go{animation:teShock .8s cubic-bezier(.15,.8,.3,1) forwards}
  @keyframes teShock{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(26)}}

  /* le singe : montée en fusée, rotation, puis ouverture en étoile */
  #turnend .rocket{position:absolute;left:50%;top:46%;width:min(74vw,320px);height:min(80vw,346px);
    margin-left:calc(min(74vw,320px) / -2);margin-top:calc(min(80vw,346px) / -2)}
  /* poussière soulevée par l'atterrissage */
  #turnend .dust{position:absolute;left:50%;top:62%;width:0;height:0}
  #turnend .dust.go::before,#turnend .dust.go::after{content:"";position:absolute;
    border-radius:50%;background:rgba(255,213,74,.22);filter:blur(9px)}
  #turnend .dust.go::before{width:150px;height:26px;left:-160px;top:-8px;animation:teDustL .8s ease-out forwards}
  #turnend .dust.go::after{width:150px;height:26px;left:10px;top:-8px;animation:teDustR .8s ease-out forwards}
  @keyframes teDustL{0%{opacity:0;transform:translateX(70px) scaleX(.3)}25%{opacity:1}100%{opacity:0;transform:translateX(-40px) scaleX(1.5)}}
  @keyframes teDustR{0%{opacity:0;transform:translateX(-70px) scaleX(.3)}25%{opacity:1}100%{opacity:0;transform:translateX(40px) scaleX(1.5)}}
  /* secousse de l'écran à l'impact */
  #turnend.landed .rays{animation:teRays 5s linear infinite, teRaysIn .6s ease-out forwards, teQuake .38s ease-out}
  @keyframes teQuake{0%,100%{margin-top:-100vmax}25%{margin-top:calc(-100vmax + 7px)}60%{margin-top:calc(-100vmax - 4px)}}
  #turnend .rocket svg{width:100%;height:100%;overflow:visible;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
  /* traînée de la fusée */
  #turnend .trail{position:absolute;left:50%;bottom:-10vh;width:16px;height:70vh;margin-left:-8px;
    background:linear-gradient(to top,rgba(255,213,74,0),rgba(255,213,74,.55),rgba(255,150,30,0));
    filter:blur(7px);transform-origin:50% 100%;
    animation:teTrail .6s ease-out forwards}
  @keyframes teTrail{0%{opacity:0;transform:scaleY(.2)}25%{opacity:1}100%{opacity:0;transform:scaleY(1.4)}}

  /* l'ouverture en étoile : bras et jambes s'écartent d'un coup */
  #turnend .limbs{transform-origin:100px 132px;transform:scale(.32)}

  /* le texte */
  #turnend .txt{position:absolute;left:0;right:0;bottom:14vh;text-align:center;padding:0 18px}
  #turnend .tbravo{font-family:var(--sans);font-size:clamp(40px,13vw,74px);letter-spacing:.06em;
    color:var(--nyellow);line-height:1;
    text-shadow:0 0 14px rgba(255,213,74,.9),0 0 44px rgba(255,170,40,.55);
    opacity:0;transform:scale(.5);animation:tePop .5s cubic-bezier(.2,1.8,.35,1) .8s forwards}
  #turnend .tsub{font-family:var(--sans);font-size:clamp(19px,5.4vw,28px);letter-spacing:.08em;
    color:var(--cream);margin-top:10px;line-height:1.25;
    opacity:0;transform:translateY(14px);animation:teUp .45s cubic-bezier(.2,1.5,.4,1) 1s forwards}
  #turnend .ttotal{font-family:var(--sans);font-size:clamp(15px,4vw,20px);letter-spacing:.14em;
    color:var(--muted);margin-top:12px;opacity:0;animation:teUp .45s ease-out 1.2s forwards}
  #turnend .tnext{position:absolute;left:0;right:0;bottom:5vh;text-align:center;
    font-family:var(--sans);font-size:14px;letter-spacing:.22em;color:var(--muted);
    opacity:0;animation:teBlink 1.4s ease-in-out 1.5s infinite}
  @keyframes tePop{to{opacity:1;transform:scale(1)}}
  @keyframes teUp{to{opacity:1;transform:none}}
  @keyframes teBlink{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ============ LA MASCOTTE : LE SINGE DORÉ ============ */
  #mascot{position:fixed;right:8px;bottom:150px;width:84px;height:84px;z-index:60;pointer-events:auto;
    cursor:pointer;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:opacity .3s}
  #mascot.hide{opacity:0;pointer-events:none}
  #mascot svg{width:100%;height:100%;overflow:visible}
  /* respiration permanente, très légère */
  #mascot .body{transform-origin:50% 90%;animation:mBreathe 3.4s ease-in-out infinite}
  @keyframes mBreathe{50%{transform:scaleY(1.035) scaleX(.985)}}
  /* la queue balance en continu */
  #mascot .tail{transform-origin:22% 40%;animation:mTail 2.8s ease-in-out infinite}
  @keyframes mTail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
  /* clignement : la paupière descend d'un coup */
  #mascot .lid{transform-origin:50% 0%;transform:scaleY(0)}
  #mascot.blink .lid{animation:mBlink .18s ease-in-out}
  @keyframes mBlink{0%,100%{transform:scaleY(0)}45%{transform:scaleY(1)}}
  /* états */
  #mascot.happy .whole{animation:mJump .85s cubic-bezier(.25,1.6,.4,1)}
  @keyframes mJump{0%{transform:translateY(0) scale(1)}
    30%{transform:translateY(-26px) scale(1.06,.94)}
    55%{transform:translateY(0) scale(.92,1.08)}
    75%{transform:translateY(-8px) scale(1.02,.98)}
    100%{transform:none}}
  /* les mains : au repos le long du corps, elles montent ou couvrent les yeux */
  #mascot .hand{transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  #mascot.happy .hand-l{transform:translate(6px,-64px) rotate(-18deg)}
  #mascot.happy .hand-r{transform:translate(-6px,-64px) rotate(18deg)}
  #mascot.sad .hand-l{transform:translate(24px,-46px)}
  #mascot.sad .hand-r{transform:translate(-24px,-46px)}
  #mascot.greed .hand-l{transform:translate(28px,-22px)}
  #mascot.greed .hand-r{transform:translate(-28px,-22px)}
  #mascot.shock .hand-l{transform:translate(2px,-10px)}
  #mascot.shock .hand-r{transform:translate(-2px,-10px)}
  #mascot.sad .whole{animation:mSad .9s ease-in-out}
  @keyframes mSad{0%,100%{transform:none}35%{transform:translateY(9px) scale(1.03,.93) rotate(-3deg)}}
  /* bouche : sourire au repos, moue quand ça se passe mal */
  #mascot .mouth{transition:d .3s}
  #mascot.sad .mouth{transform:translateY(4px) scaleY(-1);transform-origin:60px 73px}
  #mascot.shock .whole{animation:mShock .5s cubic-bezier(.36,.07,.19,.97) 2}
  @keyframes mShock{20%{transform:translateX(-6px) rotate(-4deg)}60%{transform:translateX(6px) rotate(4deg)}100%{transform:none}}
  #mascot.shock .pupil{transform:scale(1.35)}
  #mascot.greed .whole{animation:mGreed .6s ease-in-out 2}
  @keyframes mGreed{50%{transform:scale(1.09) rotate(2deg)}}
  #mascot.crown .crown{opacity:1;transform:translateY(0) rotate(0)}
  #mascot .crown{opacity:0;transform:translateY(-14px) rotate(-25deg);transform-origin:50% 100%;
    transition:opacity .3s,transform .5s cubic-bezier(.2,1.7,.4,1)}
  #mascot .pupil{transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
  /* bulle de réplique */
  #mascot .bubble{position:absolute;right:78px;bottom:34px;background:rgba(27,15,51,.96);
    border:1.5px solid var(--nyellow);border-radius:12px;padding:7px 11px 6px;white-space:nowrap;
    font-family:var(--sans);font-size:14px;letter-spacing:.07em;color:var(--nyellow);
    box-shadow:0 0 14px rgba(255,213,74,.3);opacity:0;transform:translateX(8px) scale(.9);
    transform-origin:100% 50%;transition:opacity .2s,transform .35s cubic-bezier(.2,1.7,.4,1)}
  #mascot.say .bubble{opacity:1;transform:none}

  /* couche Lottie plein écran pour les grosses célébrations */
  #lottie{position:fixed;left:0;right:0;top:6%;height:52%;z-index:91;pointer-events:none;display:none}
  #lottie.show{display:block;animation:lotIn .3s ease-out}
  @keyframes lotIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  #lottie svg{width:100%!important;height:100%!important}

  /* ============ ÉCRAN DE LANCEMENT : LE B QUI GRÉSILLE ============ */
  #boot{position:fixed;inset:0;z-index:95;background:#120821;
    background-image:radial-gradient(ellipse 120% 70% at 50% -10%, #2A1550 0%, #120821 60%);
    display:flex;align-items:center;justify-content:center;
    animation:bootOut .45s ease-in 1.45s forwards}
  #boot .bootB{font-family:'Monoton',var(--sans);font-size:clamp(90px,32vw,190px);color:var(--nyellow);
    line-height:1;
    text-shadow:0 0 12px rgba(255,213,74,.95),0 0 40px rgba(255,170,40,.65),0 0 100px rgba(255,140,20,.4);
    animation:bootFlick 1.5s steps(1) forwards}
  /* le même grésillement irrégulier que le O de l'enseigne */
  @keyframes bootFlick{
    0%{opacity:0}
    6%{opacity:1}
    14%{opacity:.12}
    18%{opacity:1}
    26%{opacity:.5}
    30%{opacity:1}
    54%{opacity:1}
    58%{opacity:.08}
    62%{opacity:.9}
    66%{opacity:.2}
    70%{opacity:1}
    100%{opacity:1}}
  @keyframes bootOut{to{opacity:0;visibility:hidden}}
  @media (prefers-reduced-motion: reduce){#boot{display:none}}

  /* ============ EXTINCTION TÉLÉ + BRUME ============ */
  /* 1. l'écran se replie comme une vieille télé qu'on éteint */
  #portal{position:fixed;inset:0;z-index:92;background:#000;display:none;
    align-items:center;justify-content:center;overflow:hidden}
  #portal.show{display:flex}
  #portal .crt{width:100%;height:100vh;background:#fff;
    box-shadow:0 0 60px rgba(255,255,255,.9);
    animation:crtOff .46s cubic-bezier(.5,0,.6,1) forwards}
  @keyframes crtOff{
    0%{transform:scaleY(1) scaleX(1);opacity:.92;filter:brightness(1)}
    38%{transform:scaleY(.005) scaleX(1);opacity:1;filter:brightness(2.4)}
    62%{transform:scaleY(.005) scaleX(.035);opacity:1}
    80%{transform:scaleY(.02) scaleX(.02);opacity:1}
    100%{transform:scaleY(0) scaleX(0);opacity:0}}
  /* 2. l'étoile blanche, très brève */
  #portal .star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;
    box-shadow:0 0 22px 6px rgba(255,255,255,.95);opacity:0;
    animation:starPop .2s ease-out .3s forwards}
  #portal .star::before,#portal .star::after{content:"";position:absolute;left:50%;top:50%;background:#fff;
    box-shadow:0 0 14px rgba(255,255,255,.9)}
  #portal .star::before{width:170px;height:2px;margin:-1px 0 0 -85px}
  #portal .star::after{width:2px;height:110px;margin:-55px 0 0 -1px}
  @keyframes starPop{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.5)}}

  /* 3. la brume rouge se lève par-dessus l'énigme, déjà installée dessous */
  #fog{position:fixed;inset:0;z-index:88;display:none;pointer-events:none;overflow:hidden}
  #fog.show{display:block}
  #fog .veil{position:absolute;inset:0;
    background:radial-gradient(ellipse 120% 90% at 50% 115%,#9E1226 0%,#4A0812 45%,#120306 100%);
    animation:veilOut 2.5s ease-in forwards}
  @keyframes veilOut{0%{opacity:1}50%{opacity:.9}100%{opacity:0}}
  #fog .blob{position:absolute;border-radius:50%;filter:blur(44px);will-change:transform;
    animation:fogRise 2.5s cubic-bezier(.25,.6,.35,1) forwards}
  @keyframes fogRise{
    0%{transform:translateY(38vh) scale(.55);opacity:0}
    22%{opacity:.95}
    70%{opacity:.55}
    100%{transform:translateY(-46vh) scale(1.8);opacity:0}}

  /* ============ PORTE SECRÈTE ============ */
  #secret{position:fixed;inset:0;z-index:85;background:radial-gradient(ellipse 100% 70% at 50% 105%,#5A0B18 0%,#26050C 45%,#0B0205 100%);
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;gap:16px}
  #secret.show{display:flex;animation:secIn .5s ease-out}
  @keyframes secIn{from{opacity:0}to{opacity:1}}
  #secret .sectitle{font-family:var(--sans);font-size:clamp(22px,6vw,34px);letter-spacing:.18em;color:#F2B8C0;
    text-shadow:0 0 14px rgba(214,60,80,.9),0 0 46px rgba(214,60,80,.5)}
  #secret .sectext{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.6;
    color:var(--cream);max-width:460px}
  #secret input{max-width:340px;border-color:rgba(242,184,192,.35);text-align:center;font-family:var(--sans);letter-spacing:.2em;font-size:22px;text-transform:uppercase}
  #secret .secerr{color:var(--nred);font-family:var(--sans);letter-spacing:.1em;font-size:15px;min-height:20px}
  #secret .secbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:380px}

  /* ============ CUPS ============ */
  /* ============ CUPS — ENSEIGNE ROUGE ============ */
  #cups{position:fixed;inset:0;z-index:84;
    background:#12030A;
    background-image:radial-gradient(ellipse 120% 70% at 50% -10%, #4E0A1C 0%, #12030A 62%),
                     radial-gradient(ellipse 80% 40% at 50% 115%, rgba(214,60,80,.16) 0%, transparent 60%);
    display:none;flex-direction:column;padding:14px 14px 24px;overflow-y:auto}
  #cups.show{display:flex;animation:cupsIn .5s cubic-bezier(.2,1.2,.35,1)}
  @keyframes cupsIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
  /* scanlines + vignette, comme l'enseigne principale */
  #cups::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.10;
    background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.6) 2px 3px)}
  #cups::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse 105% 90% at 50% 45%, transparent 55%, rgba(8,1,4,.65) 100%)}
  #cups>*{position:relative;z-index:2}

  #cups h2{font-family:'Monoton',var(--sans);font-weight:400;font-size:clamp(30px,10vw,50px);
    letter-spacing:.1em;text-align:center;color:#FF5E72;line-height:1.1;
    text-shadow:0 0 7px rgba(255,94,114,.95),0 0 20px rgba(255,60,85,.7),0 0 46px rgba(214,20,50,.5),0 0 90px rgba(180,10,40,.35);
    animation:signflick 8s linear infinite}
  #cups h2 .fu{animation:brokenO 5.2s linear infinite;display:inline-block}
  #cups .csub{text-align:center;font-family:var(--sans);font-size:12.5px;letter-spacing:.24em;color:#FF9FB0;
    margin-top:4px;text-shadow:0 0 9px rgba(255,120,140,.8)}
  .cdots{display:flex;justify-content:center;gap:9px;margin:9px 0 2px}
  .cdots i{width:6px;height:6px;border-radius:50%;display:block;background:#FF5E72;
    box-shadow:0 0 8px #FF5E72;animation:chase 2.1s linear infinite}
  .cdots i:nth-child(2){animation-delay:.35s}.cdots i:nth-child(3){animation-delay:.7s}
  .cdots i:nth-child(4){animation-delay:1.05s}.cdots i:nth-child(5){animation-delay:1.4s}
  .cdots i:nth-child(6){animation-delay:1.75s}

  .cbank{display:flex;flex:0 0 auto;gap:10px;margin-top:12px}
  .cplayer{flex:1;background:rgba(18,3,10,.7);border:1.5px solid rgba(255,94,114,.35);border-radius:12px;
    padding:10px 8px 8px;text-align:center;position:relative;
    box-shadow:0 0 14px rgba(255,60,85,.12), inset 0 0 18px rgba(255,60,85,.06);
    transition:transform .2s,border-color .2s,box-shadow .2s}
  .cplayer.lead{border-color:#FFD54A;box-shadow:0 0 20px rgba(255,213,74,.35), inset 0 0 20px rgba(255,213,74,.08)}
  .cplayer.won{animation:cWin .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes cWin{0%{transform:scale(1)}35%{transform:scale(1.08) translateY(-4px)}100%{transform:none}}
  .cplayer .cn{font-family:var(--sans);font-size:15px;letter-spacing:.11em;color:#FFB3C0;text-transform:uppercase}
  .cplayer .cm{font-family:var(--sans);font-size:32px;color:#FFE8C8;line-height:1.1;
    text-shadow:0 0 8px rgba(255,232,200,.85),0 0 22px rgba(255,120,140,.5);animation:buzz 3.6s linear infinite}
  .cprog{height:4px;border-radius:2px;background:rgba(255,94,114,.16);margin-top:6px;overflow:hidden}
  .cprog i{display:block;height:100%;width:0;border-radius:2px;background:#FF5E72;
    box-shadow:0 0 9px rgba(255,94,114,1);transition:width .8s cubic-bezier(.2,.9,.3,1)}

  .ctable{flex:0 0 auto;margin-top:16px;border:1.5px solid rgba(255,94,114,.35);border-radius:18px;padding:16px 14px;
    background:rgba(18,3,10,.72);overflow:hidden;position:relative;
    box-shadow:0 0 24px rgba(255,60,85,.16), inset 0 0 30px rgba(255,60,85,.05);
    animation:breathe 5s ease-in-out infinite alternate}
  /* rampe d'ampoules en haut de la table */
  .ctable::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:repeating-linear-gradient(90deg,#FF5E72 0 8px,transparent 8px 22px);
    background-size:22px 3px;filter:drop-shadow(0 0 5px #FF5E72);animation:marquee 1.1s linear infinite;opacity:.85}
  .chand{display:flex;gap:9px;justify-content:center;margin-top:8px}
  .ccard{width:58px;height:82px;border-radius:9px;background:#FFF4E2;color:#12030A;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:var(--sans);font-size:25px;line-height:1;
    border:2px solid rgba(255,244,226,.9);
    box-shadow:0 0 14px rgba(255,244,226,.55), 0 5px 0 rgba(0,0,0,.45);
    animation:cDeal .5s cubic-bezier(.2,1.35,.35,1) both}
  @keyframes cDeal{0%{transform:translateY(-40px) rotate(-14deg) scale(.7);opacity:0}
    60%{transform:translateY(4px) rotate(2deg) scale(1.03);opacity:1}100%{transform:none}}
  .ccard.red{color:#C4102B}
  .ccard .cs{font-size:18px;margin-top:2px}
  .ccard.hidden{background:rgba(18,3,10,.7);color:#FF5E72;border-color:rgba(255,94,114,.6);
    text-shadow:0 0 10px rgba(255,94,114,.9);box-shadow:0 0 14px rgba(255,60,85,.3), inset 0 0 14px rgba(255,60,85,.12)}
  .chand.win .ccard{animation:cDeal .5s cubic-bezier(.2,1.35,.35,1) both,cGlow 1s ease-in-out infinite alternate .5s}
  @keyframes cGlow{to{box-shadow:0 0 30px rgba(255,213,74,.95), 0 5px 0 rgba(0,0,0,.45)}}
  .chand.lose .ccard{opacity:.4;filter:grayscale(.6);box-shadow:0 5px 0 rgba(0,0,0,.4)}
  .cverdict{text-align:center;font-family:var(--sans);font-size:20px;letter-spacing:.06em;margin-top:14px;
    color:#FFE8C8;min-height:26px;text-shadow:0 0 10px rgba(255,180,150,.55);animation:apop .35s cubic-bezier(.2,1.6,.4,1)}
  .crules{flex:0 0 auto;font-size:12.5px;color:#C98494;line-height:1.5;margin-top:12px;font-style:italic}

  /* boutons néon rouges */
  #cups button{background:rgba(18,3,10,.65);border:2px solid;border-bottom-width:5px;border-radius:12px;
    font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase}
  .b-felt{border-color:#FFD54A;color:#FFD54A;text-shadow:0 0 8px rgba(255,213,74,.85);
    box-shadow:0 0 14px rgba(255,213,74,.35), inset 0 0 12px rgba(255,213,74,.1)}
  .b-felt2{border-color:#FF5E72;color:#FF8A9C;text-shadow:0 0 8px rgba(255,94,114,.85);
    box-shadow:0 0 14px rgba(255,60,85,.32), inset 0 0 12px rgba(255,60,85,.12)}
  #cups textarea{width:100%;background:rgba(18,3,10,.75);border:2px solid rgba(255,94,114,.4);border-radius:12px;
    color:#FFE8C8;font-size:16px;padding:12px;margin-top:10px;font-family:var(--serif);min-height:82px;resize:vertical}
  #cups textarea:focus{outline:none;border-color:#FFD54A;box-shadow:0 0 14px rgba(255,213,74,.3)}
  .cdare{text-align:center;margin-top:6px}
  .cdare .cdt{font-family:var(--sans);font-size:27px;letter-spacing:.08em;color:#FFD54A;
    text-shadow:0 0 10px rgba(255,213,74,.9),0 0 30px rgba(255,120,60,.5);
    animation:titlein .5s cubic-bezier(.2,1.6,.4,1) both}

  /* les écrans d'événement reprennent la typo des sous-titres */
  #overlay .sub2{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    font-size:15px;letter-spacing:-.01em;line-height:1.5}

  /* ============ EFFETS D'ÉCRAN & PLUIES DE PARTICULES ============ */
  #fxlayer{position:fixed;inset:0;pointer-events:none;z-index:86;overflow:hidden}
  .rainbit{position:absolute;top:-40px;font-size:28px;will-change:transform;animation:rainfall linear forwards}
  @keyframes rainfall{to{transform:translateY(112vh) rotate(var(--spin,360deg));opacity:.35}}
  .coinbit{filter:drop-shadow(0 0 8px rgba(255,213,74,.9))}
  .featherbit{animation:featherfall ease-in forwards}
  @keyframes featherfall{
    0%{transform:translateY(0) rotate(0) translateX(0);opacity:1}
    35%{transform:translateY(35vh) rotate(80deg) translateX(30px)}
    70%{transform:translateY(70vh) rotate(-60deg) translateX(-30px)}
    100%{transform:translateY(112vh) rotate(40deg) translateX(10px);opacity:.4}}
  #stage.fx-shake{animation:scShake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes scShake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  #stage.fx-tilt{animation:scTilt 1.1s ease-in-out}
  @keyframes scTilt{25%{transform:rotate(-2.2deg) scale(1.02)}60%{transform:rotate(2deg) scale(1.02)}100%{transform:none}}
  #stage.fx-glitch{animation:scGlitch .7s steps(2) 2}
  @keyframes scGlitch{0%,100%{transform:none;filter:none}20%{transform:translateX(-4px);filter:hue-rotate(35deg)}40%{transform:translateX(4px);filter:hue-rotate(-30deg)}60%{transform:translateY(2px)}}
  #stage.fx-mirror{animation:scMirror .9s ease-in-out}
  @keyframes scMirror{30%,70%{transform:scaleX(-1)}100%{transform:none}}
  #stage.fx-zoom{animation:scZoom .6s cubic-bezier(.2,1.5,.4,1)}
  @keyframes scZoom{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
  .flashfx{position:fixed;inset:0;pointer-events:none;z-index:85;opacity:0;animation:flashOut .55s ease-out forwards}
  @keyframes flashOut{0%{opacity:.55}100%{opacity:0}}
  .flip-in{animation:flipIn .55s cubic-bezier(.2,1.15,.35,1) both;transform-origin:center}
  @keyframes flipIn{
    0%{transform:perspective(900px) rotateY(-92deg) scale(.88);opacity:0}
    55%{transform:perspective(900px) rotateY(12deg) scale(1.02);opacity:1}
    100%{transform:none;opacity:1}}

  /* ============ ANIMATIONS « DUOLINGO » ADAPTÉES ============ */
  button{border-bottom-width:5px;transition:transform .06s,border-bottom-width .06s,margin-bottom .06s,box-shadow .2s}
  button:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
  #banner{position:fixed;left:0;right:0;bottom:36px;z-index:87;padding:14px 18px 16px;
    display:flex;align-items:center;gap:14px;transform:translateY(115%);
    transition:transform .34s cubic-bezier(.2,1.45,.4,1);pointer-events:none}
  #banner.show{transform:none}
  #banner.good{background:linear-gradient(180deg,rgba(77,230,168,.14),rgba(18,8,33,.97));border-top:2px solid var(--nmint)}
  #banner.bad{background:linear-gradient(180deg,rgba(255,77,90,.16),rgba(18,8,33,.97));border-top:2px solid var(--nred)}
  #banner.fire{background:linear-gradient(180deg,rgba(255,122,61,.20),rgba(18,8,33,.97));border-top:2px solid var(--norange)}
  #banner .bico{font-size:44px;line-height:1;animation:bico .5s cubic-bezier(.2,1.7,.4,1)}
  @keyframes bico{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
  #banner .btxt{flex:1}
  #banner .btit{font-family:var(--sans);font-size:23px;letter-spacing:.06em;line-height:1.05}
  #banner.good .btit{color:var(--nmint);text-shadow:0 0 12px rgba(77,230,168,.7)}
  #banner.bad .btit{color:var(--nred);text-shadow:0 0 12px rgba(255,77,90,.7)}
  #banner.fire .btit{color:var(--norange);text-shadow:0 0 12px rgba(255,122,61,.8)}
  #banner .bsub{font-size:13.5px;color:var(--cream2);margin-top:3px;line-height:1.35}
  .prog{height:4px;border-radius:2px;background:rgba(244,235,216,.14);margin-top:6px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--nyellow);
    box-shadow:0 0 8px rgba(255,213,74,.9);transition:width .85s cubic-bezier(.2,.9,.3,1)}
  .pod.active .prog i{background:var(--cream);box-shadow:0 0 10px rgba(255,244,224,.9)}
  .prog.near i{background:var(--nmint);box-shadow:0 0 10px rgba(77,230,168,.9);animation:nearPulse 1s ease-in-out infinite alternate}
  @keyframes nearPulse{to{opacity:.55}}
  .bdg.fire{border-color:var(--norange);color:var(--norange);text-shadow:0 0 8px rgba(255,122,61,.9);
    animation:fireBadge .9s ease-in-out infinite alternate}
  @keyframes fireBadge{to{transform:scale(1.12)}}

  /* échelle de la chance : barreaux dans le podium */
  .ladder{display:flex;gap:2px;justify-content:center;margin-top:5px}
  .ladder i{flex:1;max-width:16px;height:6px;border-radius:1px;background:rgba(244,235,216,.16)}
  .ladder i.on{background:var(--nyellow);box-shadow:0 0 6px rgba(255,213,74,.9)}
  .ladder i.st{background:rgba(178,108,255,.5)}
  .ladder i.st.on{background:var(--nmint);box-shadow:0 0 6px rgba(77,230,168,.9)}
  .rungbadge{font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--cream2)}

  /* blackjack de l'Anneau */
  .bjrow{margin-top:14px}
  .bjlbl{font-family:var(--sans);font-size:15px;letter-spacing:.1em;color:var(--cream2);text-transform:uppercase}
  .bjlbl b{color:var(--cream);font-size:19px}
  .bjhand{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
  .bjc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:62px;
    border:2px solid var(--cream);border-radius:9px;background:rgba(18,8,33,.7);
    font-family:var(--sans);font-size:26px;letter-spacing:.04em;
    box-shadow:0 0 12px currentColor;animation:flipIn .4s cubic-bezier(.2,1.2,.35,1) both}
  .bjc.back{border-color:rgba(178,108,255,.5);color:var(--nviolet);box-shadow:none}

  /* carte de station */
  .station{text-align:center}
  .station .stico{font-size:64px;line-height:1;margin-bottom:6px;display:block}


  /* série de bonnes réponses */
  .bdg.fire{border-color:var(--norange);color:var(--norange);text-shadow:0 0 8px rgba(255,122,61,.9);
    animation:fireBadge .9s ease-in-out infinite alternate}
  @keyframes fireBadge{to{transform:scale(1.12)}}

  /* pastille de valeur de la question */
  .valrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
  .val{font-family:var(--sans);font-size:26px;letter-spacing:.05em;padding:3px 14px 1px;border-radius:10px;
    border:2px solid var(--nyellow);color:var(--nyellow);text-shadow:0 0 10px rgba(255,213,74,.8);
    box-shadow:0 0 14px rgba(255,213,74,.28), inset 0 0 12px rgba(255,213,74,.1)}
  .val.mint{border-color:var(--nmint);color:var(--nmint);text-shadow:0 0 10px rgba(77,230,168,.8);box-shadow:0 0 14px rgba(77,230,168,.28), inset 0 0 12px rgba(77,230,168,.1)}
  .val.viol{border-color:var(--nviolet);color:var(--nviolet);text-shadow:0 0 10px rgba(178,108,255,.8);box-shadow:0 0 14px rgba(178,108,255,.28), inset 0 0 12px rgba(178,108,255,.1)}
  .val.orange{border-color:var(--norange);color:var(--norange);text-shadow:0 0 10px rgba(255,122,61,.8);box-shadow:0 0 14px rgba(255,122,61,.28), inset 0 0 12px rgba(255,122,61,.1)}
  .val.mal{border-color:var(--nred);color:var(--nred);font-size:20px;text-shadow:0 0 10px rgba(255,77,90,.7);box-shadow:none}
  .valbonus{font-family:var(--sans);font-size:17px;letter-spacing:.06em;color:var(--cream2);
    border:1px dashed rgba(244,235,216,.35);border-radius:9px;padding:5px 10px 3px}

  /* défi bonus mis en avant */
  .challenge{margin-top:12px;border:1px solid rgba(255,213,74,.4);border-radius:12px;padding:10px 12px;
    background:rgba(255,213,74,.06)}
  .challenge b{font-family:var(--sans);letter-spacing:.14em;font-size:13px;color:var(--nyellow);display:block;margin-bottom:3px}

  /* sélecteur de difficulté segmenté */
  .seg{display:flex;gap:0;border:2px solid rgba(178,108,255,.4);border-radius:12px;overflow:hidden;margin-top:10px}
  .seg button{flex:1;min-width:0;border:0;border-radius:0;background:transparent;color:var(--cream2);animation:none;box-shadow:none;
    text-shadow:none;padding:12px 4px;font-size:15px;border-right:1px solid rgba(178,108,255,.3)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:rgba(255,213,74,.14);color:var(--nyellow);text-shadow:0 0 10px rgba(255,213,74,.8)}
  .seglbl{font-family:var(--sans);letter-spacing:.2em;font-size:12px;color:var(--muted);margin-top:14px}
  .diffbadge{font-family:var(--sans);font-size:12px;letter-spacing:.14em;border:1px solid rgba(178,108,255,.5);
    color:var(--nviolet);border-radius:999px;padding:2px 9px 0}

  /* duel */
  .duelrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0 4px}
  .duelside{flex:1;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px 6px}
  .duelside .dn{font-family:var(--sans);font-size:19px;letter-spacing:.06em;color:var(--cream)}
  .duelvs{font-family:var(--sans);font-size:26px;color:var(--nred);text-shadow:0 0 12px rgba(255,77,90,.8);animation:vsPulse 1.4s ease-in-out infinite}
  @keyframes vsPulse{50%{transform:scale(1.14)}}

  /* ---------- setup ---------- */
  input[type=text]{width:100%;background:rgba(18,8,33,.7);border:1.5px solid var(--line);border-radius:10px;color:var(--cream);font-size:16px;padding:13px 14px;margin-top:8px;font-family:var(--serif)}
  input[type=text]:focus{outline:none;border-color:var(--nyellow);box-shadow:0 0 14px rgba(255,213,74,.35)}
  .plist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .plist .pi{display:flex;justify-content:space-between;background:rgba(37,21,67,.85);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;font-size:17px}
  .plist .pi span:last-child{color:var(--nred);cursor:pointer;text-shadow:0 0 8px rgba(255,77,90,.7)}
  .goal{color:var(--muted);font-size:13px;text-align:center;margin-top:14px;font-style:italic}

const AI={on:true,diff:"normal",q:[],w:[],fq:false,fw:false,err:false,seen:[]};

  if(AI.q.length<6&&!AI.fq)fetchAIQuestions();

  document.querySelectorAll("#segdiff button").forEach(b=>b.classList.toggle("on",b.dataset.d===d));

async function askClaude(prompt){
  const r=await fetch(API_URL,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:API_MODEL,max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}
async function fetchAIQuestions(){
  AI.fq=true;updAIBadge();const lg=LANG;
  try{
    const diff=AI.diff==="facile"?(lg==="fr"?"facile":"easy"):AI.diff==="normal"?(lg==="fr"?"moyenne":"medium"):(lg==="fr"?"difficile":"hard");
    const prompt=lg==="fr"
      ?"Génère 8 questions de quiz MODERNES en FRANÇAIS pour un jeu d'ambiance : AU MOINS 6 questions sur 8 de pop culture (séries, films, animation, musique, jeux vidéo, réseaux sociaux, tech, sport actuel) ; les 2 autres de culture générale fun. Pas de dates d'histoire ancienne. Difficulté : "+diff+". Faits strictement exacts et vérifiables ; réponses courtes et sans ambiguïté. INTERDIT : les questions pièges, les questions dont la réponse est aucun, rien, non ou un mythe démenti, et les questions par oui/non. Chaque question doit avoir une réponse positive, précise et unique. Ne répète pas ces sujets : "+(AI.seen.slice(-30).join(" | ")||"aucun")+". Réponds UNIQUEMENT avec un tableau JSON valide, sans texte autour ni markdown : [{\"q\":\"question\",\"a\":\"réponse courte\"}]"
      :"Generate 8 MODERN quiz questions in ENGLISH for a party game: AT LEAST 6 of the 8 on pop culture (series, films, animation, music, video games, social media, tech, current sport); the other 2 fun general knowledge. No ancient-history dates. Difficulty: "+diff+". Strictly accurate, verifiable facts; short, unambiguous answers. FORBIDDEN: trick questions, questions whose answer is none, nothing, no or a debunked myth, and yes/no questions. Every question must have a positive, precise, single answer. Do not repeat these topics: "+(AI.seen.slice(-30).join(" | ")||"none")+". Reply ONLY with a valid JSON array, no surrounding text and no markdown: [{\"q\":\"question\",\"a\":\"short answer\"}]";
    const arr=await askClaude(prompt);
    if(lg===LANG)arr.forEach(o=>{if(o&&o.q&&o.a){AI.q.push([String(o.q),String(o.a)]);AI.seen.push(String(o.q).slice(0,60))}});
    AI.seen=AI.seen.slice(-40);AI.err=false;
  }catch(e){AI.err=true}
  AI.fq=false;updAIBadge();
}

      ?"Génère 6 questions SPÉCIALES type « Wicked Wango » en FRANÇAIS pour un jeu télévisé parodique : réplique culte de film ou série à identifier, « épelle ce mot à l'envers », défi chrono « cite 3 X en 5 secondes », vrai/faux piégeux, devinette, défi où l'animateur mime ou fredonne. INTERDIT : paroles de chansons. Faits exacts ; réponses courtes ou « Validation de l'animateur ». Champ t = catégorie très courte en MAJUSCULES. Réponds UNIQUEMENT avec un tableau JSON valide sans markdown : [{\"t\":\"RÉPLIQUE CULTE\",\"x\":\"question\",\"ans\":\"réponse\"}]"

function cleanName(f){
  return f.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").replace(/^\s*\d+[\s.)-]*/,"").trim();
}
function loadClips(ev){
  const files=[...(ev.target.files||[])];
  if(!files.length)return;
  SND.clips=files.map(f=>({name:cleanName(f.name),url:URL.createObjectURL(f)}));
  SND.used=[];
  const info=document.getElementById("sndinfo");
  if(info)info.textContent=T().sndOK(SND.clips.length);
}
function playClip(){if(!S||!S.sndUrl)return;try{AUD.src=S.sndUrl;AUD.currentTime=0;AUD.play()}catch(e){}}

function goSound(){
  if(!SND.clips.length)return;
  if(SND.used.length>=SND.clips.length)SND.used=[];
  let i;do{i=Math.floor(Math.random()*SND.clips.length)}while(SND.used.includes(i));
  SND.used.push(i);

  S={screen:"game",players:names.map(n=>({name:n,score:0,angel:0,mudhut:0,hopping:0,dbl:false,streak:0,dares:[],lastGain:0,rung:0,seen:{}})),

     usedQ:[],usedR:[],usedF:[],usedH:[],usedWQ:[],deckG:shuffle([...Array(DATA.fr.G.length).keys()]),wango:null,

function cp(){return S.players[S.cur]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function log(m){S.log.unshift(m);S.log=S.log.slice(0,30);renderLog()}
function fmt(n){return n.toLocaleString(LANG==="fr"?"fr-FR":"en-US")}
function pick(bank,used){if(used.length>=bank.length)used.length=0;
  let i;do{i=Math.floor(Math.random()*bank.length)}while(used.includes(i));used.push(i);return bank[i]}

/* --- mémoire longue : une question déjà posée ne revient jamais, même après redémarrage --- */
const SEEN={key:"bamboozle.seen.v1",set:new Set()};
function seenLoad(){try{const r=localStorage.getItem(SEEN.key);if(r)SEEN.set=new Set(JSON.parse(r))}catch(e){}}
function seenSave(){try{localStorage.setItem(SEEN.key,JSON.stringify([...SEEN.set].slice(-4000)))}catch(e){}}
function qid(q){let h=0;const t=String(q).toLowerCase().replace(/\s+/g," ").trim();
  for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return h.toString(36)}
function seenMark(q){SEEN.set.add(qid(q));seenSave()}
function seenHas(q){return SEEN.set.has(qid(q))}
function resetSeen(){SEEN.set=new Set();seenSave();const e=document.getElementById("seeninfo");if(e)e.textContent=T().seenReset}
/* tire dans une banque en évitant tout ce qui a déjà été posé, ici ou lors d'une partie précédente */
function pickFresh(bank,used){
  const fresh=bank.map((v,i)=>i).filter(i=>!used.includes(i)&&!seenHas(bank[i][0]||bank[i].x));
  let i;
  if(fresh.length)i=fresh[Math.floor(Math.random()*fresh.length)];
  else{ // toute la banque a été vue : on repart d'un cycle neuf pour cette banque
    const cycle=bank.map((v,k)=>k).filter(k=>!used.includes(k));
    if(!cycle.length){used.length=0;return pickFresh(bank,used)}
    i=cycle[Math.floor(Math.random()*cycle.length)];
  }
  used.push(i);const item=bank[i];seenMark(item[0]||item.x);return item;
}

/* =============== QUESTIONS =============== */
function drawQuestion(){
  topUpAI();
  S.isRetro=false;S.isFriends=false;S.isSound=false;S.sndUrl=null;S.retroUsed=false;S.showA=false;stopClip();
  const bank=D().B,recent=S.lastB||[];
  const libres=bank.filter(x=>!recent.includes(x));
  S.bonus=(libres.length?libres:bank)[Math.floor(Math.random()*(libres.length?libres.length:bank.length))];
  S.lastB=[...recent,S.bonus].slice(-Math.min(6,bank.length-1));
  if(AI.on&&AI.q.length>0){while(AI.q.length&&seenHas(AI.q[0][0]))AI.q.shift();
    if(AI.q.length){S.q=AI.q.shift();seenMark(S.q[0]);updAIBadge();return}}
  S.q=pickFresh(D().Q,S.usedQ);
}
function goRetro(){S.q=pickFresh(D().R,S.usedR);S.isRetro=true;S.retroUsed=true;S.showA=false;sfx("reveal");render()}

function gainFor(p){
  let g=p.hopping>0?75:(S.isFriends?150:(S.isSound?100:(S.isRetro?75:50)));
  if(p.dbl)g*=2;
  return g;
}
function lossFor(p){return p.dbl?50:((S&&(S.isFriends||S.isSound))?50:25)}

/* Le VRAI Bamboozle : sanction rare et catastrophique (moitié des points). */
function triggerBamboozle(p,why){
  p.dbl=false;
  if(p.mudhut>0){
    log(T().bzSaved(why,p.name));
    S.bonusQ=null;endTurn();return;
  }
  const lost=Math.floor(p.score/2);p.score-=lost;
  log(T().bzHit(why,p.name,lost,fmt(p.score)));fx("bamboozle");
  showStamp(T().bzStamp,T().bzSub(why,fmt(lost)),()=>{S.bonusQ=null;S.turnGain=0;endTurn()});
}

function answer(ok,bonus){ // bonus = défi du tour relevé (+50)
  stopClip();
  const p=cp();
  if(p.hopping>0)p.hopping--;
  if(ok){
    let g=gainFor(p)+(bonus?50:0);
    p.dbl=false;p.streak=0;
    p.combo=(p.combo||0)+1;
    p.score+=g;S.turnGain+=g;
    log(T().logOK(p.name,bonus,g,fmt(p.score)));
    buzz(30);
    mascotState("happy",900);mascotSay(p.combo>=3?T().mascotFire:T().mascotGood);
    if(p.combo>=3)banner("fire","🔥",T().comboT(p.combo),T().comboS(p.name,g,bonus));
    else banner("good",bonus?"🎯":"✅",T().goodT(g),bonus?T().goodBonus(p.name):T().goodS(p.name));
    if(S.bonusQ){S.bonusQ=null;endTurn();return}
    S.phase="action";render();
  }else{
    const L=lossFor(p);
    p.streak=(p.streak||0)+1;p.combo=0;
    if(p.streak>=3){p.streak=0;triggerBamboozle(p,T().bz3);return}
    const applyLoss=()=>{
      p.dbl=false;
      p.score=Math.max(0,p.score-L);
      log(T().logMiss(p.name,L,fmt(p.score),p.streak));
      buzz([40,70,40]);mascotState("sad",1100);mascotSay(T().mascotBad);
      banner("bad","🙈",T().badT(L),T().badS(p.streak));
      S.bonusQ=null;endTurn();
    };
    if(p.angel>0){
      askModal(T().angelQ(p.name),[
        {l:T().useA,c:"b-cy",f:()=>{p.angel--;p.dbl=false;log(T().angelUsed(p.name,p.streak));closeModal();S.bonusQ=null;endTurn()}},
        {l:T().takeP(L),c:"b-rd",f:()=>{closeModal();applyLoss()}}
      ]);
    }else applyLoss();
  }
}

/* =============== TOURS =============== */
function endTurn(){
  if(handleStation())return;   /* une station franchie se joue avant de passer la main */
  const p=cp();
  if(p.mudhut>0){p.mudhut--;if(p.mudhut===0)log(T().hutOut(p.name))}
  p.lastGain=S.turnGain;
  const gain=S.turnGain, who=p.name, total=p.score;
  /* la célébration de fin de tour, puis on enchaîne */
  showTurnEnd(who,gain,total,()=>nextPlayer());
}
function nextPlayer(){
  const q=S.players.findIndex(x=>x.score>=GOAL);
  if(q>=0){startFinal(q);return}
  S.cur=(S.cur+1)%S.players.length;S.turnGain=0;S.bonusQ=null;S.phase="question";
  if(cp().skip){cp().skip=false;log(T().skip(cp().name));S.cur=(S.cur+1)%S.players.length}
  const n=cp();
  log(T().turn(n.name,n.hopping));
  drawQuestion();render();
}

/* =============== L'ÉCHELLE DE LA CHANCE ===============
   Le parcours décrit par l'animateur, rendu jouable :
   on lance la Roue pour grimper, on passe la Cabane Dorée,
   on franchit l'Anneau Arc-en-ciel, on atteint le Singe Doré,
   on tire sa queue, et on tombe dans le Bassin du Paradis. */
const LADDER=6;
const GOAL=1500;              /* points nécessaires pour ouvrir le Bassin sans passer par le Singe */
const STATIONS={2:"hut",4:"ring",6:"monkey"};
function climbLadder(p,n){
  const before=p.rung||0;
  p.rung=Math.max(0,Math.min(LADDER,before+n));
  if(p.rung===before)return;
  if(n>0){
    log(T().climbLog(p.name,p.rung,LADDER));
    /* on note les stations franchies pendant la montée */
    for(let r=before+1;r<=p.rung;r++){
      if(STATIONS[r]&&!p.seen[r]){p.pending=r;p.seen[r]=true}
    }
  }else log(T().slipLog(p.name,p.rung));
}
/* une station en attente est traitée avant de passer la main */
function handleStation(){
  const p=cp();
  if(!p.pending)return false;
  const r=p.pending;p.pending=null;
  const kind=STATIONS[r];
  if(kind==="hut"){
    p.mudhut=2;fx("mudhut");
    log(T().stHutLog(p.name));
    showEvent("🛖",T().stHutT,T().stHutS(p.name),"climb",()=>endTurn());
    return true;
  }
  if(kind==="ring"){
    fx("angel");
    showEvent("🌈",T().stRingT,T().stRingS,"pop",()=>startRing());
    return true;
  }
  if(kind==="monkey"){
    fx("jackpot");
    showEvent("🐒",T().stMonkeyT,T().stMonkeyS(p.name),"glow",()=>{S.phase="monkeygate";render()});
    return true;
  }
  return false;
}

/* ---- L'Anneau Arc-en-ciel : une partie de blackjack contre le Singe croupier ----
   Sept couleurs, sept arcs : on tire des cartes pour approcher 21 sans le dépasser. */
const RCOLORS=["#FF4D5A","#FF7A3D","#FFD54A","#4DE6A8","#4FC3F7","#5C6BFF","#B26CFF"];
function bjCard(){
  const r=1+Math.floor(Math.random()*13);
  const label=r===1?"A":r===11?"J":r===12?"Q":r===13?"K":String(r);
  const val=r===1?11:(r>=11?10:r);
  return {label,val,c:RCOLORS[Math.floor(Math.random()*RCOLORS.length)]};
}
function bjTotal(h){
  let t=h.reduce((a,c)=>a+c.val,0),aces=h.filter(c=>c.label==="A").length;
  while(t>21&&aces>0){t-=10;aces--}
  return t;
}
function startRing(){
  S.bj={me:[bjCard(),bjCard()],monkey:[bjCard()],state:"play"};
  S.phase="ring";render();
  if(bjTotal(S.bj.me)===21)setTimeout(bjStand,700);
}
function bjHit(){
  const b=S.bj;b.me.push(bjCard());
  buzz(18);
  if(bjTotal(b.me)>21){b.state="bust";render();setTimeout(()=>bjEnd(),900);return}
  render();
}
function bjStand(){
  const b=S.bj;b.state="monkey";
  /* le Singe croupier tire jusqu'à 17 */
  while(bjTotal(b.monkey)<17)b.monkey.push(bjCard());
  render();setTimeout(()=>bjEnd(),1100);
}
function bjEnd(){
  const p=cp(),b=S.bj,me=bjTotal(b.me),mk=bjTotal(b.monkey);
  let gain=0,key="";
  if(me>21){gain=0;key="bust"}
  else if(me===21&&b.me.length===2){gain=500;key="bj"}
  else if(mk>21||me>mk){gain=300;key="win"}
  else if(me===mk){gain=150;key="push"}
  else{gain=0;key="lose"}
  if(gain){p.score+=gain;S.turnGain+=gain}
  log(T().bjLog(p.name,me,mk,gain,fmt(p.score)));
  b.state="done";
  if(gain>=300){fx("jackpot");showEvent("🌈",T().bjT[key],T().bjS[key](me,mk,gain),"spin",()=>endTurn(),true)}
  else{fx(key==="bust"?"monkey":"angel");showEvent("🌈",T().bjT[key],T().bjS[key](me,mk,gain),"pop",()=>endTurn())}
}

function spinWheel(){

  S.phase="wheel";render();sfx("roll");
  const d1=document.getElementById("d1"),d2=document.getElementById("d2");

function resolveWheel(n){
  const w=D().WHEEL[String(n)],p=cp();
  log(T().whLog(n,w.t));
  const box=document.getElementById("wres");
  box.innerHTML='<div class="big">'+n+" — "+w.t+'</div><div class="cardtxt">'+w.x+'</div><div class="btnrow" id="wbtn"></div>';

  const btn=(l,c,f)=>{const b=document.createElement("button");b.className=c;b.textContent=l;b.onclick=f;B.appendChild(b)};
  switch(n){
    case 2:{const free=S.players.filter(x=>x.mudhut===0);
      if(free.length>1){const sc=free.map(x=>x.score);for(let i=0;i<free.length;i++)free[i].score=sc[(i-1+free.length)%free.length];
        log(T().mayLog);fx("mayhem");showEvent("🌪️",T().mayT,T().mayS,"spin",done)}
      else{log(T().maySafe);btn(T().cont,"b-gold",done)}break}
    case 3:fx("tree");showEvent("🌳⏱",T().tttGo,T().tttS,"glow",()=>startTTT());break;
    case 4:p.hopping=3;btn(T().hopGo,"b-gold",done);break;
    case 5:climbLadder(p,2);btn(T().ladderBtn,"b-gold",done);break;
    case 6:p.score+=100;S.turnGain+=100;log(T().spinB(p.name,fmt(p.score)));
      btn(T().spinBtn,"b-gold",()=>{S.bonusQ=true;S.phase="question";drawQuestion();render()});break;
    case 7:fx("monkey");climbLadder(p,-1);showStamp(T().mkT,T().mkS,done);break;
    case 8:if(p.angel<2){p.angel++;log(T().angGet(p.name,p.angel));fx("angel");
        showEvent("😇",T().angT,T().angS(p.name,p.angel),"pop",done)}
      else{log(T().angFull);btn(T().cont,"b-gold",done)}break;
    case 9:{fx("backwards");drawQuestion();
      box.innerHTML+='<div class="card" style="margin-top:12px"><div class="eyebrow">'+T().bwEye+'</div><div class="qtext">'+S.q[0]+'</div><div class="atext">'+T().bwAns+S.q[1]+'</div><div class="btnrow"><button class="b-gold" onclick="bwOK(true)">'+T().bwOKb+'</button><button class="b-rd" onclick="bwOK(false)">'+T().bwKOb+'</button></div></div>';
      break}
    case 10:p.dbl=true;fx("double");showEvent("✖️2",T().dblT,T().dblS(p.name),"shake",done);break;
    case 11:fx("duel");startDuel(null);break;
    case 12:p.score+=250;S.turnGain+=250;log(T().jackLog(p.name,fmt(p.score)));fx("jackpot");
      showEvent("👑",T().jackT,T().jackS(p.name),"spin",done,true);break;
  }
}

/* =============== WICKED WANGO (crescendo) =============== */
function drawWQ(lvl){
  const L=D().LV[(lvl||1)-1],mode=L?L.d:"wq";
  /* paliers hauts : vraies questions d'expert, plus de spéciales faciles */
  if(mode==="hard"||(mode==="mix"&&Math.random()<0.6)){
    const q=pickFresh(D().H,S.usedH);
    return {t:T().hardTag,x:q[0],ans:q[1]};
  }
  topUpAI();
  if(AI.on&&AI.w.length>0&&Math.random()<0.6){const c=AI.w.shift();updAIBadge();return c}
  return pickFresh(D().WQ,S.usedWQ);
}
function actionWango(){S.wango={lvl:1,bank:0,state:"q",q:drawWQ(1),showA:false};S.phase="wango";render()}
function wangoOK(){
  const p=cp(),L=D().LV[S.wango.lvl-1];
  p.score+=L.g;S.turnGain+=L.g;S.wango.bank+=L.g;p.streak=0;
  log(T().wgOK(L.n,p.name,L.g,fmt(p.score)));
  if(S.wango.lvl>=D().LV.length){
    showEvent("🌀👑",T().wgMT,T().wgMS(p.name,fmt(S.wango.bank)),"spin",()=>endTurn(),true);return}
  S.wango.state="won";render();
}
function wangoNext(){S.wango.lvl++;S.wango.state="q";S.wango.q=drawWQ(S.wango.lvl);S.wango.showA=false;
  const L=D().LV[S.wango.lvl-1];
  showEvent("🌀",T().wgLvlT(L.n),T().wgLvlS(L.c,L.g,50*L.n),L.n>=5?"shake":"pop",()=>render())}
function wangoStop(){log(T().wgStop(cp().name,S.wango.lvl,fmt(S.wango.bank)));endTurn()}
function wangoFail(){
  const p=cp(),L=D().LV[S.wango.lvl-1],loss=50*L.n;
  p.streak=(p.streak||0)+1;
  if(p.streak>=3){p.streak=0;triggerBamboozle(p,T().bz3);return}
  if(p.mudhut>0)log(T().wgFailHut(p.name,L.n,p.streak));
  else{p.score=Math.max(0,p.score-loss);log(T().wgFail(p.name,L.n,loss,fmt(p.score),p.streak))}
  showEvent("💥",T().wgFT,T().wgFS(L.n,loss,S.wango.bank?fmt(S.wango.bank):0),"shake",()=>endTurn());
}

function startDuel(after){

function duelPick(i){
  const d=S.duel;

  else if(d.b===null&&i!==d.a){d.b=i;d.q=pickFresh(D().Q,S.usedQ);d.showA=false;
    sfx("roll");fx("duel");showEvent("⚔️",T().duelT,T().duelS(S.players[d.a].name,S.players[d.b].name),"shake",()=>render());return}
  render();
}
function duelEnd(w){ // w = index du gagnant, ou null si personne
  const d=S.duel,A=S.players[d.a],B=S.players[d.b];
  if(w===null){log(T().duelNone(A.name,B.name))}
  else{
    const win=S.players[w],lose=S.players[w===d.a?d.b:d.a];
    win.score+=150;win.streak=0;win.combo=(win.combo||0)+1;lose.combo=0;buzz(30);
    if(lose.mudhut>0)log(T().duelHut(win.name,lose.name));

    showEvent("⚔️",T().duelWT(win.name),T().duelWS(win.name,lose.name),"spin",()=>{finishDuel()},true);
    return;

}

function drawG(){if(S.deckG.length===0)S.deckG=shuffle([...Array(DATA.fr.G.length).keys()]);return D().G[S.deckG.pop()]}
function actionGoogle(){
  const dbl=S.wangoDouble;S.wangoDouble=false;
  const c=drawG();S.phase="card";S.card={deck:T().gT+(dbl?T().gDbl:""),c,dblPending:dbl};render();
  /* signature propre au type de carte, dès qu'elle se retourne */
  fx(c.k==="gimme"?"gimme":c.k==="monkey"?"monkey":c.k==="duel"?"duel":
     (c.k==="adv"&&c.fx==="hut")?"mudhut":(c.k==="adv"&&c.fx==="angel")?"angel":
     (c.k==="adv"&&c.fx==="steal100")?"steal":(c.k==="adv"&&c.fx==="skip")?"skip":
     (c.k==="adv"&&c.fx==="dbl")?"double":c.k==="dare"?"dare":"card");
  chooseGoogleTarget(c,dbl);
}
function chooseGoogleTarget(c,dbl){
  const B=document.getElementById("cardbtn");B.innerHTML="";
  if(c.k!=="dare"){renderGoogleButtons(c,dbl,cp());return}
  const others=S.players.map((x,i)=>({x,i})).filter(o=>o.i!==S.cur);
  if(others.length===1){log(T().gInf(cp().name,c.t,others[0].x.name));renderGoogleButtons(c,dbl,others[0].x);return}
  B.insertAdjacentHTML("beforebegin",'<div class="hint" id="wtgt">'+T().gWho+'</div>');
  others.forEach(o=>{const b=document.createElement("button");b.className="b-cy";b.textContent=o.x.name;b.onclick=()=>{
    const e=document.getElementById("wtgt");if(e)e.remove();
    log(T().gInf(cp().name,c.t,o.x.name));renderGoogleButtons(c,dbl,o.x)};B.appendChild(b)});
}
function renderGoogleButtons(c,dbl,t){
  const B=document.getElementById("cardbtn");B.innerHTML="";
  const next=()=>{if(dbl){const c2=drawG();S.card={deck:T().g2,c:c2,dblPending:false};render();chooseGoogleTarget(c2,false)}else endTurn()};
  const btn=(l,cl,f)=>{const b=document.createElement("button");b.className=cl;b.textContent=l;b.onclick=f;B.appendChild(b)};
  const p=cp();
  const withAngel=(v,q,eff)=>{
    if(v.angel>0){askModal(q,[
      {l:T().gCancel,c:"b-cy",f:()=>{v.angel--;log(T().gCancelLog(v.name));closeModal();next()}},
      {l:T().gTake,c:"b-rd",f:()=>{closeModal();eff()}}]);}
    else eff();
  };
  switch(c.k){
    case "dare":
      if(c.a==="dance"){
        btn(T().gDanceOK(t.name),"b-gold",()=>{t.score+=100;log(T().gDanceLog(t.name,fmt(t.score)));next()});
        btn(T().gSoul,"b-rd",()=>{log(T().gSoulLog);next()});
      }else if(c.a==="hop"){t.hopping=2;btn(T().gHop(t.name),"b-gold",next)}
      else{t.dares=(t.dares||[]);t.dares.push({t:c.t});
        btn(T().gDareB,"b-gold",()=>{log(T().gDareLog(t.name));next()})}
      break;
    case "adv":
      switch(c.fx){
        case "plus100":p.score+=100;S.turnGain+=100;log(T().gPlus(p.name,fmt(p.score)));btn(T().cont,"b-gold",next);break;
        case "dbl":p.dbl=true;btn(T().gDblB,"b-gold",next);break;
        case "hut":p.mudhut=3;log(T().hutFree(p.name));
          showEvent("🪜🛖",T().hutT,T().hutFreeS(p.name),"climb",next);break;
        case "angel":if(p.angel<2){p.angel++;log(T().angGet(p.name,p.angel));
            showEvent("😇",T().angT,T().angS(p.name,p.angel),"pop",next)}
          else{log(T().angFull2);btn(T().cont,"b-gold",next)}break;
        case "steal100":btn(T().gStealB,"b-mg",()=>pickTarget(T().gStealQ,true,(v)=>{
            withAngel(v,T().gTgt(v.name),()=>{const amt=Math.min(100,v.score);v.score-=amt;p.score+=amt;S.turnGain+=amt;
              log(T().gStealLog(p.name,amt,v.name));next()});}));break;
        case "skip":btn(T().gSkipB,"b-mg",()=>pickTarget(T().gSkipQ,false,(v)=>{
            v.skip=true;log(T().gSkipLog(v.name));next()}));break;
      }break;
    case "gimme":
      btn(T().gStealB,"b-mg",()=>{
        pickTarget(T().gimQ,true,(v)=>{
          const act=()=>{const amt=v.score;v.score=0;p.score+=amt;S.turnGain+=amt;
            log(T().gimLog(p.name,v.name,fmt(amt)));fx("gimme");
            showEvent("💰",T().gimT,T().gimS(p.name,v.name,fmt(amt)),"shake",()=>endTurn(),true)};
          if(v.angel>0){askModal(T().gimTgt(v.name),[
            {l:T().gCancel,c:"b-cy",f:()=>{v.angel--;log(T().gimCancelLog(v.name));closeModal();endTurn()}},
            {l:T().gTake,c:"b-rd",f:()=>{closeModal();act()}}]);}
          else act();
        });
      });break;
    case "duel":btn(T().duelBtn,"b-rd",()=>startDuel(next));break;
    case "monkey":btn(T().mkBtn,"b-mg",()=>{fx("monkey");showStamp(T().mkT,T().mkS2,()=>endTurn())});break;
    case "dbl":S.wangoDouble=true;btn(T().slide,"b-cy",next);break;
    default:btn(T().cont,"b-gold",next);
  }
}

function startTimer(sec,onEnd){stopTimer();S.timer=sec;updTimer();
  TI=setInterval(()=>{S.timer--;updTimer();if(S.timer<=10&&S.timer>0)sfx("tick");if(S.timer<=0){stopTimer();onEnd()}},1000)}
function stopTimer(){if(TI){clearInterval(TI);TI=null}}
function updTimer(){const e=document.getElementById("timer");if(!e)return;
  e.textContent=S.timer+" s";e.classList.toggle("hot",S.timer<=10)}

/* =============== SON DE PLATEAU (WebAudio, aucun fichier) =============== */
const SFX={on:true,ctx:null};
function actx(){if(!SFX.ctx){try{SFX.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){SFX.on=false}}return SFX.ctx}
function tone(f,t0,dur,type,vol){
  const c=actx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t0);
  g.gain.setValueAtTime(0,c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.02);
}
function sfx(kind){
  if(!SFX.on)return;
  try{
    if(kind==="good"){tone(880,0,.14,"triangle");tone(1320,.09,.22,"triangle")}
    else if(kind==="bad"){tone(180,0,.32,"sawtooth",.13);tone(120,.05,.34,"sawtooth",.1)}
    else if(kind==="fanfare"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.15))}
    else if(kind==="doom"){[400,340,280,200].forEach((f,i)=>tone(f,i*.13,.4,"sawtooth",.12))}
    else if(kind==="roll"){for(let i=0;i<11;i++)tone(300+i*22,i*.085,.06,"square",.07)}
    else if(kind==="tick"){tone(1200,0,.04,"square",.06)}
    else if(kind==="reveal"){tone(660,0,.1,"sine",.1);tone(990,.07,.18,"sine",.1)}
  }catch(e){}
}
function toggleSFX(){SFX.on=!SFX.on;const b=document.getElementById("sfxbtn");if(b)b.textContent=SFX.on?"🔊":"🔇";if(SFX.on){actx();sfx("tick")}}

/* =============== PORTE SECRÈTE : L'ÉNIGME DU O ===============
   Le second O de l'enseigne est le tube défectueux… et le seul bouton
   caché du jeu. Une énigme garde l'entrée. */
function norm(x){return String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"")}
function openPortal(){
  mascotHide(true);
  const p=document.getElementById("portal");
  p.innerHTML='<div class="crt"></div><div class="star"></div>';
  p.classList.add("show");
  /* le claquement sec d'un tube qui s'éteint */
  try{tone(2600,0,.05,"square",.09);tone(140,.28,.35,"sine",.10)}catch(e){}
  buzz([12,40,60]);
  setTimeout(()=>{
    p.classList.remove("show");p.innerHTML="";
    openSecret();      /* l'énigme est déjà là, dessous : elle attend */
    raiseFog();

}

/* =============== CUPS ===============
   Règles reconstituées par les fans à partir de l'épisode : le classement
   des cartes est inversé, le 2 de trèfle domine tout, et deux combinaisons
   écrasent le reste — la Full Cup (4+9) et la D-Cup (3+6). */
const CUPS={goal:1500};
const SUITS=[{s:"♣",r:false},{s:"♠",r:false},{s:"♥",r:true},{s:"♦",r:true}];
function cupsDeck(){
  const d=[];
  SUITS.forEach(su=>{for(let r=1;r<=13;r++)d.push({r,label:r===1?"A":r===11?"J":r===12?"Q":r===13?"K":String(r),s:su.s,red:su.r})});
  d.push({r:0,label:"★",s:"",red:false,joker:true});   /* la Saucer Card */
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  return d;
}
/* classement inversé : plus l'index est bas, plus la main est forte */
const SINGLE=[4,9,2,3,5,6,7,8,10,11,12,13,1];
function cupsEval(h){
  if(h.some(c=>c.joker))return {rank:-1,pay:0,key:"saucer"};
  if(h.some(c=>c.r===2&&c.s==="♣"))return {rank:0,pay:250,key:"clubs2"};
  const rs=h.map(c=>c.r).sort((a,b)=>a-b);
  if(rs[0]===3&&rs[1]===6)return {rank:1,pay:300,key:"dcup"};
  if(rs[0]===4&&rs[1]===9)return {rank:2,pay:200,key:"fullcup"};
  let best=99,half=false;
  h.forEach(c=>{const i=SINGLE.indexOf(c.r);if(i>=0&&i<best){best=i;half=(c.r===4||c.r===9)}});
  return {rank:3+best,pay:half?100:50,key:half?"half":"trick"};
}
function openCups(){
  mascotHide(true);
  const names=(S&&S.players&&S.players.length>=2)?[S.players[0].name,S.players[1].name]:[T().cupsP1,T().cupsP2];
  CUPS.st={deck:cupsDeck(),names,money:[0,0],hands:[[],[]],phase:"deal",verdict:"",doubled:[false,false],winner:null};
  document.getElementById("cups").classList.add("show");
  cupsDeal();
}
function closeCups(){document.getElementById("cups").classList.remove("show");mascotHide(false)}
function cupsDeal(){
  const g=CUPS.st;
  if(g.deck.length<6)g.deck=cupsDeck();
  g.hands=[[g.deck.pop(),g.deck.pop()],[g.deck.pop(),g.deck.pop()]];
  g.phase="reveal";g.verdict="";
  renderCups();
}
function cupsShow(){
  const g=CUPS.st;
  const a=cupsEval(g.hands[0]),b=cupsEval(g.hands[1]);
  g.phase="shown";g.lastWin=null;
  if(a.key==="saucer"||b.key==="saucer"){
    const w=a.key==="saucer"?0:1,l=1-w;
    const amt=g.money[l];g.money[w]+=amt;g.money[l]=0;
    g.verdict=T().cupsSaucer(g.names[w],fmt(amt));g.lastWin=w;
    sfx("fanfare");buzz([120,60,120]);rain(["★","🍷","★"],26,"coinbit",2.4);flash("rgba(214,60,80,.35)");
    banner("fire","★",T().cupsSaucerT,T().cupsSaucer(g.names[w],fmt(amt)));
    renderCups();return cupsCheckWin();
  }
  if(a.rank===b.rank){g.phase="sit";g.verdict=T().cupsTie;renderCups();return}
  const w=a.rank<b.rank?0:1,ev=w===0?a:b;
  g.money[w]+=ev.pay;g.lastWin=w;
  g.verdict=T().cupsWin(g.names[w],T().cupsHand[ev.key],ev.pay);
  sfx("good");buzz(ev.pay>=200?[40,50,90]:25);
  if(ev.pay>=200){rain(["🍷","🪙"],18,"coinbit",2.2);flash("rgba(214,60,80,.25)")}
  banner(ev.pay>=200?"fire":"good",ev.key==="dcup"?"🍷":ev.key==="fullcup"?"🥃":ev.key==="clubs2"?"♣":"🃏",
         T().cupsBanner(ev.pay),T().cupsWin(g.names[w],T().cupsHand[ev.key],ev.pay));
  renderCups();cupsCheckWin();
}
function cupsSit(i){                       /* le bonus « premier assis » */
  const g=CUPS.st;g.money[i]+=50;g.lastWin=i;
  g.verdict=T().cupsSat(g.names[i]);
  g.phase="shown";sfx("good");buzz([25,40,25]);
  banner("good","🪑",T().cupsSitT,T().cupsSat(g.names[i]));
  renderCups();cupsCheckWin();
}
function cupsCheckWin(){
  const g=CUPS.st;
  g.money.forEach((m,i)=>{
    if(m>=700&&!g.doubled[i]&&m<CUPS.goal){
      g.doubled[i]=true;
      g.money[i]=m*2;
      const card=g.deck.pop();
      const lucky=(card.r===2&&card.s==="♣");
      if(lucky)g.money[i]+=100;
      g.verdict=T().cupsDouble(g.names[i],fmt(g.money[i]),card.label+card.s,lucky);
      sfx("fanfare");buzz([50,40,50,40,150]);
      rain(["💵","🪙","💵"],30,"coinbit",2.4);flash("rgba(247,227,192,.3)");
      banner("fire","💵",T().cupsDoubleT,T().cupsDouble(g.names[i],fmt(g.money[i]),card.label+card.s,lucky));
    }
  });
  const w=g.money.findIndex(m=>m>=CUPS.goal);
  if(w>=0){g.winner=w;g.phase="dare";g.dare="";sfx("fanfare");buzz([60,50,60,50,250]);
    rain(["🍷","🏆","💵","★"],46,"coinbit",3);flash("rgba(214,60,80,.4)")}
  renderCups();
}
