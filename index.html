}

/* =============== MOTEUR À RESSORTS ===============
   Ce qui donne le « toucher » d'une appli soignée : rien ne s'arrête net,
   tout dépasse légèrement sa cible avant de se stabiliser. */
function springTo(from,to,opts,onUpdate,onDone){
  const stiff=(opts&&opts.stiffness)||170, damp=(opts&&opts.damping)||16, mass=(opts&&opts.mass)||1;
  let x=from, v=(opts&&opts.velocity)||0, last=performance.now(), done=false;
  function step(now){
    let dt=Math.min(0.064,(now-last)/1000); last=now;
    for(let i=0;i<3;i++){                       /* sous-pas : stable même si la frame saute */
      const h=dt/3;
      const a=(-stiff*(x-to)-damp*v)/mass;
      v+=a*h; x+=v*h;
    }
    onUpdate(x);
    if(Math.abs(x-to)<0.4&&Math.abs(v)<0.4){onUpdate(to);if(onDone&&!done){done=true;onDone()}return}
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* =============== LOTTIE : CÉLÉBRATIONS VECTORIELLES ===============
   Le runtime est chargé depuis un CDN. S'il est absent (hors ligne),
   tout continue de fonctionner : on retombe sur les particules maison. */
const LOTTIE={anim:null,ready:()=>typeof window!=="undefined"&&!!window.lottie&&typeof window.lottie.loadAnimation==="function"};
function playLottie(url,opts,onFail){
  if(!LOTTIE.ready()){if(onFail)onFail();return false}
  const host=document.getElementById("lottie");
  try{
    if(LOTTIE.anim){LOTTIE.anim.destroy();LOTTIE.anim=null}
    host.innerHTML="";host.classList.add("show");
    LOTTIE.anim=window.lottie.loadAnimation({
      container:host,renderer:"svg",loop:(opts&&opts.loop)||false,autoplay:true,path:url});
    const done=()=>{host.classList.remove("show");host.innerHTML="";
      if(LOTTIE.anim){LOTTIE.anim.destroy();LOTTIE.anim=null}};
    /* on fige sur la dernière image plutôt que de disparaître d'un coup */
    LOTTIE.anim.addEventListener("complete",()=>{if(opts&&opts.keep)return;done()});
    /* fichier absent ou illisible : on repasse sur l'animation maison */
    LOTTIE.anim.addEventListener("data_failed",()=>{done();if(onFail)onFail()});
    return true;
  }catch(e){host.classList.remove("show");if(onFail)onFail();return false}
}

/* =============== LA MASCOTTE : LE SINGE DORÉ ===============
   Une machine à états simple : le singe est toujours dans un état,
   il ne joue pas des clips isolés. */
const MASCOT={state:"idle",timer:null,blink:null,el:null};
function mascotSVG(){

function mountMascot(){
  const el=document.createElement("div");
  el.id="mascot";el.innerHTML=mascotSVG()+'<div class="bubble"></div>';

    mascotState(Math.random()<.5?"greed":"shock",900);buzz(12)});
  document.body.appendChild(el);MASCOT.el=el;
  /* clignements irréguliers, comme un vrai regard */
  const loop=()=>{
    if(MASCOT.el){MASCOT.el.classList.add("blink");setTimeout(()=>MASCOT.el.classList.remove("blink"),200)}
    MASCOT.blink=setTimeout(loop,1800+Math.random()*4200);
  };
  MASCOT.blink=setTimeout(loop,2200);
  /* le regard suit le doigt */
  document.addEventListener("pointermove",e=>{
    if(!MASCOT.el)return;
    const r=MASCOT.el.getBoundingClientRect();
    const dx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/260));

    MASCOT.el.querySelectorAll(".pupil").forEach(p=>{
      p.style.transform="translate("+(dx*2.6).toFixed(2)+"px,"+(dy*2.2).toFixed(2)+"px)"});
  },{passive:true});
}

/* ============================================================
   LE RIG : chaque pièce a son ressort, avec un retard propre.
   C'est ce décalage entre le corps et ses extrémités qui donne
   l'impression de masse et de vie.
   ============================================================ */
function Rig(root){
  this.root=root; this.parts={}; this.t=0; this.raf=null;
  this.get=id=>root.querySelector("#"+id);
  /* état du corps, cible et vitesse pour chaque canal */
  this.S={y:900,rot:0,scale:.4,squashY:1,squashX:1,
          armL:0,armR:0,legL:0,legR:0,tail:0,earL:0,earR:0,
          headY:0,headRot:0,brow:0,mouth:0,cheek:0,lid:0};
  this.T=Object.assign({},this.S);
  this.V={}; for(const k in this.S) this.V[k]=0;
  /* raideur et amortissement par canal : les extrémités sont plus molles */
  this.K={y:[150,17],rot:[120,16],scale:[190,15],squashY:[260,13],squashX:[260,13],
          armL:[180,11],armR:[180,11],legL:[170,12],legR:[170,12],
          tail:[70,7],earL:[95,8],earR:[95,8],headY:[130,12],headRot:[110,10],
          brow:[200,14],mouth:[200,16],cheek:[160,16],lid:[420,22]};
}
Rig.prototype.set=function(o){for(const k in o)this.T[k]=o[k]};
Rig.prototype.step=function(dt){
  for(const k in this.S){
    const kk=this.K[k]||[160,14];
    const a=(-kk[0]*(this.S[k]-this.T[k])-kk[1]*this.V[k]);
    this.V[k]+=a*dt; this.S[k]+=this.V[k]*dt;
  }
};
Rig.prototype.apply=function(){
  const S=this.S,g=this.get;
  const root=g("teRoot");
  if(root)root.setAttribute("transform",
    "translate(0,"+S.y.toFixed(2)+") rotate("+S.rot.toFixed(2)+" 120 150) "+
    "translate(120,200) scale("+(S.scale*S.squashX).toFixed(3)+","+(S.scale*S.squashY).toFixed(3)+") translate(-120,-200)");
  const rot=(id,deg,ox,oy)=>{const n=g(id);if(n)n.setAttribute("transform","rotate("+deg.toFixed(2)+" "+ox+" "+oy+")")};
  rot("teArmL",S.armL,92,148); rot("teArmR",S.armR,148,148);
  rot("teLegL",S.legL,102,182); rot("teLegR",S.legR,138,182);
  rot("teTail",S.tail,148,176);
  rot("teEarL",S.earL,84,112); rot("teEarR",S.earR,156,112);
  const head=g("teHead");
  if(head)head.setAttribute("transform","translate(0,"+S.headY.toFixed(2)+") rotate("+S.headRot.toFixed(2)+" 120 118)");
  const bl=g("teBrowL"),br=g("teBrowR");
  if(bl)bl.setAttribute("transform","translate(0,"+(-S.brow).toFixed(2)+")");
  if(br)br.setAttribute("transform","translate(0,"+(-S.brow).toFixed(2)+")");
  const m=g("teMouthPath");
  if(m)m.setAttribute("d","M100 138 Q120 "+(140+S.mouth*22).toFixed(1)+" 140 138 Q120 "+(144+S.mouth*6).toFixed(1)+" 100 138");
  const cl=g("teCheekL"),cr=g("teCheekR");
  if(cl)cl.setAttribute("opacity",Math.max(0,S.cheek).toFixed(2));
  if(cr)cr.setAttribute("opacity",Math.max(0,S.cheek).toFixed(2));
  const ll=g("teLidL"),lr=g("teLidR");
  if(ll)ll.setAttribute("height",Math.max(0,S.lid*28).toFixed(1));
  if(lr)lr.setAttribute("height",Math.max(0,S.lid*28).toFixed(1));
};
Rig.prototype.start=function(){
  let last=performance.now();
  const loop=now=>{
    let dt=Math.min(.05,(now-last)/1000); last=now; this.t+=dt;
    for(let i=0;i<2;i++)this.step(dt/2);
    this.apply();
    this.raf=requestAnimationFrame(loop);
  };
  this.raf=requestAnimationFrame(loop);
};
Rig.prototype.stop=function(){if(this.raf)cancelAnimationFrame(this.raf);this.raf=null};

/* =============== FIN DE TOUR : LA SÉQUENCE ===============
   1. anticipation sous l'écran   2. décollage étiré, rotation
   3. impact écrasé + poussière   4. ouverture en étoile
   5. respiration, clignements, salut de la main                       */
let TEND={cb:null,timer:null,rig:null,timeouts:[]};
function teClearTimers(){TEND.timeouts.forEach(clearTimeout);TEND.timeouts=[]}
function teAt(ms,fn){TEND.timeouts.push(setTimeout(fn,ms))}

function showTurnEnd(name,gain,total,after){
  const el=document.getElementById("turnend");
  if(!el){if(after)after();return}
  mascotHide(true);teClearTimers();
  const positif=gain>0;
  el.className="";
  el.innerHTML='<div class="rays"></div><div class="trail"></div><div class="shock"></div>'+
    '<div class="dust"></div>'+
    '<div class="rocket">'+bigMonkeySVG()+'</div>'+
    '<div class="txt"><div class="tbravo">'+(positif?T().teBravo:T().teOuch)+'</div>'+
    '<div class="tsub">'+(positif?T().teSub(name,fmt(gain)):T().teSubBad(name))+'</div>'+
    '<div class="ttotal">'+T().teTotal(fmt(total))+'</div></div>'+
    '<div class="tnext">'+T().teNext+'</div>';
  el.classList.add("show");

  /* si une animation Lottie est fournie pour la fin de tour, elle remplace le singe maison */
  if(LOTTIE_URLS.turnend&&LOTTIE.ready()){
    const rk=el.querySelector(".rocket");if(rk)rk.style.visibility="hidden";
    playLottie(LOTTIE_URLS.turnend,{keep:true},()=>{if(rk)rk.style.visibility=""});
  }
  if(TEND.rig)TEND.rig.stop();
  const rig=new Rig(el); TEND.rig=rig;
  /* départ : sous l'écran, minuscule, membres collés au corps */
  rig.S=Object.assign(rig.S,{y:760,rot:-40,scale:.42,squashY:1.5,squashX:.72,
    armL:64,armR:-64,legL:34,legR:-34,tail:-30,earL:0,earR:0,headY:0,headRot:0,
    brow:0,mouth:0,cheek:0,lid:0});
  rig.T=Object.assign({},rig.S);
  for(const k in rig.V)rig.V[k]=0;
  rig.start();

  /* 1 — décollage : le corps s'étire dans la vitesse, la tête traîne derrière */
  teAt(60,()=>{
    rig.set({y:-40,rot:700,scale:1.12,squashY:1.42,squashX:.76,headY:16,headRot:-10,tail:38});
    rig.V.y=-2600; rig.V.rot=1500;
  });
  /* 2 — impact : écrasement franc, la tête rattrape, les oreilles claquent */
  teAt(560,()=>{
    rig.set({y:26,rot:720,scale:1,squashY:.74,squashX:1.3,headY:-8,headRot:6,
             earL:-26,earR:26,tail:-46});
    rig.V.squashY=-6; rig.V.squashX=6;
    const d=el.querySelector(".dust");if(d)d.classList.add("go");
    const sh=el.querySelector(".shock");if(sh)sh.classList.add("go");
    sfx(positif?"good":"bad"); buzz(positif?[30,40,60]:[80]);
    el.classList.add("landed");
  });
  /* 3 — rebond d'étirement, puis ouverture en étoile membre par membre */
  teAt(700,()=>rig.set({y:0,squashY:1.12,squashX:.92,headY:2,headRot:-2}));
  teAt(800,()=>{
    rig.set({squashY:1,squashX:1,armL:-54,armR:54,mouth:1,brow:7});
    rig.V.armL=-220; rig.V.armR=220;
  });
  teAt(880,()=>rig.set({legL:-26,legR:26,earL:8,earR:-8,tail:24}));
  teAt(980,()=>{
    if(positif){rig.set({cheek:.85,headRot:-3});sfx("fanfare");dropConfetti(el);buzz([40,40,40,40,160])}
    else{rig.set({brow:-6,mouth:.15,armL:22,armR:-22,headRot:0,headY:6});sfx("doom");buzz([120,80,120])}
  });
  /* 4 — vie : respiration, balancement de queue, clignements, petit salut */
  teAt(1150,()=>{
    let phase=0;
    const idle=()=>{
      if(!TEND.rig||TEND.rig!==rig)return;
      phase++;
      const breathe=(phase%2)?1.03:.98;
      rig.set({squashY:breathe,squashX:2-breathe,
               tail:24+Math.sin(phase)*18, headRot:(positif?-3:0)+Math.sin(phase*.7)*2,
               earL:(phase%2?6:-4),earR:(phase%2?-6:4)});
      TEND.timeouts.push(setTimeout(idle,620));
    };
    idle();
    /* clignements irréguliers */
    const blink=()=>{
      if(!TEND.rig||TEND.rig!==rig)return;
      rig.set({lid:1});
      TEND.timeouts.push(setTimeout(()=>rig.set({lid:0}),90));
      TEND.timeouts.push(setTimeout(blink,900+Math.random()*2200));
    };
    TEND.timeouts.push(setTimeout(blink,700));
    /* petit salut de la main droite, deux fois */
    if(positif){
      let w=0;
      const wave=()=>{
        if(!TEND.rig||TEND.rig!==rig||w>3)return;
        rig.set({armR:(w%2)?54:78}); w++;
        TEND.timeouts.push(setTimeout(wave,190));
      };
      TEND.timeouts.push(setTimeout(wave,520));
    }
  });

  const close=()=>{
    clearTimeout(TEND.timer);teClearTimers();
    const lot=document.getElementById("lottie");
    if(lot){lot.classList.remove("show");lot.innerHTML="";
      if(LOTTIE.anim){try{LOTTIE.anim.destroy()}catch(e){}LOTTIE.anim=null}}
    if(TEND.rig){TEND.rig.stop();TEND.rig=null}
    el.classList.remove("show");el.innerHTML="";el.className="";
    mascotHide(false);
    const f=TEND.cb;TEND.cb=null;if(f)f();
  };
  TEND.cb=after;
  el.onclick=close;
  TEND.timer=setTimeout(close,4200);
}

/* pluie de particules (pièces, bananes, plumes, confettis d'or…) */
function rain(chars,n,cls,dur){
  const L=document.getElementById("fxlayer");if(!L)return;
  for(let i=0;i<n;i++){
    const e=document.createElement("span");
    e.className="rainbit "+(cls||"");
    e.textContent=chars[i%chars.length];
    e.style.left=(Math.random()*100)+"vw";
    e.style.fontSize=(20+Math.random()*20)+"px";
    e.style.setProperty("--spin",(Math.random()*900-450)+"deg");
    e.style.animationDuration=((dur||3)+Math.random()*1.8)+"s";
    e.style.animationDelay=(Math.random()*.9)+"s";
    L.appendChild(e);setTimeout(()=>e.remove(),6500);
  }
}
/* distorsion de l'écran de jeu */
function screenFx(cls){
  const st=document.getElementById("stage");if(!st)return;
  st.classList.remove("fx-shake","fx-tilt","fx-glitch","fx-mirror","fx-zoom");
  void st.offsetWidth;

  L.appendChild(e);setTimeout(()=>e.remove(),700);

/* effet complet nommé, appelé à chaque carte spéciale */
function fx(kind){
  switch(kind){

      if(LOTTIE_URLS.jackpot)playLottie(LOTTIE_URLS.jackpot);
      fxVib("jackpot");rain(["🪙","💰","🪙","✨"],34,"coinbit",2.6);flash("rgba(255,213,74,.35)");screenFx("fx-zoom");break;

let BT=null;
function buzz(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
function banner(kind,icon,title,sub,ms){
  const e=document.getElementById("banner");if(!e)return;
  e.className=kind;
  e.innerHTML='<div class="bico">'+icon+'</div><div class="btxt"><div class="btit">'+title+'</div>'+
              (sub?'<div class="bsub">'+sub+'</div>':'')+'</div>';
  requestAnimationFrame(()=>e.classList.add("show"));
  clearTimeout(BT);BT=setTimeout(()=>e.classList.remove("show"),ms||1900);
}
function hideBanner(){const e=document.getElementById("banner");if(e)e.classList.remove("show");clearTimeout(BT)}

/* =============== EFFETS DE PLATEAU =============== */
let PREV=[];
function animScore(el,from,to){
  if(from===to){el.textContent=fmt(to);return}
  /* ressort : le compteur dépasse légèrement puis revient — c'est ce dépassement
     d'un cheveu qui fait toute la différence à l'œil */
  springTo(from,to,{stiffness:150,damping:14},v=>{el.textContent=fmt(Math.round(v))},
    ()=>{el.textContent=fmt(to)});
  const pod=el.closest(".pod");
  if(pod)springTo(0,1,{stiffness:220,damping:11},k=>{
    pod.style.transform="translateY("+(-6*Math.sin(k*Math.PI)).toFixed(2)+"px) scale("+(1+0.05*Math.sin(k*Math.PI)).toFixed(3)+")";
  },()=>{pod.style.transform=""});
}
function floatPts(pod,delta){
  const e=document.createElement("div");
  e.className="fx-pts "+(delta>0?"up":"down");
  e.textContent=(delta>0?"+":"−")+fmt(Math.abs(delta));
  pod.appendChild(e);setTimeout(()=>e.remove(),1300);
}

function renderPodiums(){
  const el=document.getElementById("podiums");
  if(!S||S.screen==="setup"){el.innerHTML="";return}
  el.className=S.players.length>8?"n9":(S.players.length>4?"n5":"");
  el.innerHTML=S.players.map((p,i)=>{
    const b=[];
    if(p.angel>0)b.push('<span class="bdg cy">😇 ×'+p.angel+'</span>');
    if(p.mudhut>0)b.push('<span class="bdg gold">🛖 '+p.mudhut+'</span>');
    if(p.hopping>0)b.push('<span class="bdg mg">🦵 '+p.hopping+'</span>');
    if(p.dbl)b.push('<span class="bdg mg">×2</span>');
    if((p.dares||[]).length)b.push('<span class="bdg mg">🎭 '+p.dares.length+'</span>');
    if(p.skip)b.push('<span class="bdg rd">🔇</span>');
    if(p.streak>0)b.push('<span class="bdg rd">💥 '+p.streak+'/3</span>');
    if((p.combo||0)>=2)b.push('<span class="bdg fire">🔥 ×'+p.combo+'</span>');
    return '<div class="pod '+(i===S.cur&&S.screen==="game"?"active":"")+'" onclick="podMenu('+i+')">'+
      '<div class="nm">'+p.name+'</div><div class="sc">'+fmt(p.score)+'</div><div class="badges">'+b.join("")+'</div>'+
      '<div class="prog'+(p.score>=GOAL*0.75?" near":"")+'"><i style="width:'+Math.min(100,Math.round(p.score/GOAL*100))+'%"></i></div>'+
      '<div class="ladder">'+Array.from({length:LADDER},(_,k)=>{
         const r=k+1;return '<i class="'+(STATIONS[r]?"st ":"")+((p.rung||0)>=r?"on":"")+'"></i>'}).join("")+'</div></div>';
  }).join("");
  /* animation des variations de score */
  const pods=el.querySelectorAll(".pod");
  let bigGain=0,bigLoss=0;
  S.players.forEach((p,i)=>{
    const before=(PREV[i]===undefined)?p.score:PREV[i];
    if(before!==p.score&&pods[i]){
      const d=p.score-before;
      animScore(pods[i].querySelector(".sc"),before,p.score);
      floatPts(pods[i],d);
      pods[i].classList.add(d>0?"win":"lose");
      setTimeout(()=>{if(pods[i])pods[i].classList.remove("win","lose")},750);
      if(d>0)bigGain=Math.max(bigGain,d);else bigLoss=Math.max(bigLoss,-d);
    }
  });
  if(bigGain>=200)sfx("fanfare");else if(bigGain>0)sfx("good");
  if(bigLoss>=150)sfx("doom");else if(bigLoss>0)sfx("bad");
  PREV=S.players.map(p=>p.score);
}

    '<div class="pi"><span>'+n+'</span><span onclick="setupNames.splice('+i+',1);drawPlist()">✕</span></div>').join("");
