<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BAMBOOZLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#120821; --ink2:#1B0F33; --ink3:#251543;
    --nyellow:#FFD54A; --nviolet:#B26CFF; --norange:#FF7A3D; --nblue:#4FC3F7; --nred:#FF4D5A; --nmint:#4DE6A8;
    --cream:#FFF4E0; --muted:#8E7FA8; --line:rgba(178,108,255,.35);
    --sans:'Bebas Neue','Arial Narrow',Arial,sans-serif;
    --serif:'Lora',Georgia,serif;
    /* rétro-compat */
    --stage:var(--ink); --panel:var(--ink2); --panel2:var(--ink3);
    --gold:var(--nyellow); --magenta:var(--norange); --cyan:var(--nblue); --red:var(--nred); --dim:var(--muted);
    --plum:var(--ink); --plum2:var(--ink2); --plum3:var(--ink3); --mustard:var(--nyellow);
    --perk:var(--norange); --logoblue:var(--nblue); --brick:var(--nred); --mint:var(--nmint); --cream2:#D8CBB6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink);
    background-image:radial-gradient(ellipse 120% 70% at 50% -10%, #2A1550 0%, var(--ink) 60%),
                     radial-gradient(ellipse 80% 40% at 50% 115%, rgba(178,108,255,.14) 0%, transparent 60%);
    color:var(--cream);font-family:var(--serif);min-height:100vh;padding-bottom:110px;position:relative;overflow-x:hidden}
  /* scanlines CRT */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.10;
    background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.6) 2px 3px)}
  /* vignette */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 105% 90% at 50% 45%, transparent 55%, rgba(6,2,14,.55) 100%)}
  header,#podiums,#stage,#logwrap{position:relative;z-index:3}

  /* ---------- enseigne ---------- */
  header{padding:6px 16px 4px;text-align:center}
  header h1{font-family:'Monoton',var(--sans);font-weight:400;font-size:clamp(30px,8.6vw,48px);letter-spacing:.1em;line-height:1;color:var(--nyellow);
    text-shadow:0 0 6px rgba(255,213,74,.9),0 0 18px rgba(255,213,74,.6),0 0 42px rgba(255,170,40,.45),0 0 80px rgba(255,150,30,.3);
    animation:signflick 9s linear infinite}
  @keyframes signflick{
    0%,6.9%,7.3%,52%,53.4%,100%{opacity:1}
    7%,7.2%{opacity:.55}
    52.6%,53.2%{opacity:.7}
    52.8%{opacity:.4}}
  header h1 .flicko{animation:brokenO 4.6s linear infinite;display:inline-block}
  @keyframes brokenO{
    0%,8%,12%,58%,64%,100%{opacity:1;text-shadow:inherit}
    9%,11%{opacity:.12;text-shadow:none}
    10%{opacity:.5}
    59%,61%,63%{opacity:.18;text-shadow:none}
    60%,62%{opacity:.75}}
  .dots{display:flex;justify-content:center;gap:10px;margin:10px 0 5px}
  .dots i{width:7px;height:7px;border-radius:50%;display:block;animation:chase 2.4s linear infinite}
  .dots i:nth-child(1){background:var(--nred);box-shadow:0 0 8px var(--nred);animation-delay:0s}
  .dots i:nth-child(2){background:var(--nblue);box-shadow:0 0 8px var(--nblue);animation-delay:.4s}
  .dots i:nth-child(3){background:var(--nyellow);box-shadow:0 0 8px var(--nyellow);animation-delay:.8s}
  .dots i:nth-child(4){background:var(--nmint);box-shadow:0 0 8px var(--nmint);animation-delay:1.2s}
  .dots i:nth-child(5){background:var(--norange);box-shadow:0 0 8px var(--norange);animation-delay:1.6s}
  .dots i:nth-child(6){background:var(--cream);box-shadow:0 0 8px var(--cream);animation-delay:2s}
  @keyframes chase{0%,70%,100%{opacity:.35;transform:scale(1)}80%{opacity:1;transform:scale(1.5)}90%{opacity:.6}}
  header .sub{color:var(--nviolet);font-family:var(--sans);font-size:13px;letter-spacing:.32em;margin-top:3px;text-transform:uppercase;
    text-shadow:0 0 8px rgba(178,108,255,.8),0 0 20px rgba(178,108,255,.4)}

  /* ---------- podiums ---------- */
  #podiums{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;padding:10px 12px}
  #podiums.n5{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
  #podiums.n5 .pod{padding:8px 5px 6px}
  #podiums.n5 .pod .nm{font-size:13px;letter-spacing:.05em}
  #podiums.n5 .pod .sc{font-size:28px}
  #podiums.n5 .bdg{font-size:10px;padding:0 5px}
  #podiums.n9{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
  #podiums.n9 .pod{padding:6px 4px 5px;border-radius:10px}
  #podiums.n9 .pod .nm{font-size:11px;letter-spacing:.03em}
  #podiums.n9 .pod .sc{font-size:22px}
  #podiums.n9 .fx-pts{font-size:19px;top:18px}
  .pod{min-width:0;background:rgba(27,15,51,.72);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px 8px;text-align:center;position:relative;cursor:pointer;
    box-shadow:0 0 14px rgba(178,108,255,.12), inset 0 0 18px rgba(178,108,255,.06);transition:transform .15s,border-color .15s,box-shadow .2s}
  .pod.active{border-color:var(--nyellow);box-shadow:0 0 18px rgba(255,213,74,.35), inset 0 0 20px rgba(255,213,74,.08);transform:translateY(-2px)}
  .pod.active::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--nyellow);
    box-shadow:0 0 10px var(--nyellow);animation:dotblink 1.1s steps(2,start) infinite}
  @keyframes dotblink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  .pod .nm{font-family:var(--sans);font-size:16px;letter-spacing:.1em;color:var(--cream2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .sc{font-family:var(--sans);font-size:38px;color:var(--nyellow);line-height:1.05;margin-top:2px;
    text-shadow:0 0 6px rgba(255,213,74,.8),0 0 18px rgba(255,213,74,.4)}
  .pod.active .sc{color:var(--cream);text-shadow:0 0 6px rgba(255,244,224,.9),0 0 20px rgba(255,213,74,.7);animation:buzz 3.4s linear infinite}
  @keyframes buzz{0%,91%,94%,100%{transform:none;opacity:1}92%{transform:translateX(.6px);opacity:.85}93%{transform:translateX(-.6px)}}
  .badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:18px;margin-top:5px}
  .bdg{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--cream2)}
  .bdg.gold{border-color:var(--nmint);color:var(--nmint);text-shadow:0 0 6px rgba(77,230,168,.7)}
  .bdg.cy{border-color:var(--nblue);color:var(--nblue);text-shadow:0 0 6px rgba(79,195,247,.7)}
  .bdg.mg{border-color:var(--norange);color:var(--norange);text-shadow:0 0 6px rgba(255,122,61,.7)}
  .bdg.rd{border-color:var(--nred);color:var(--nred);text-shadow:0 0 6px rgba(255,77,90,.7)}

  /* ---------- scène ---------- */
  #stage{padding:6px 14px 14px;max-width:560px;margin:0 auto}
  .card{background:rgba(27,15,51,.78);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:10px;
    box-shadow:0 0 22px rgba(178,108,255,.16), inset 0 0 26px rgba(178,108,255,.05);animation:breathe 5s ease-in-out infinite alternate}
  @keyframes breathe{from{box-shadow:0 0 16px rgba(178,108,255,.12), inset 0 0 22px rgba(178,108,255,.04)}to{box-shadow:0 0 28px rgba(178,108,255,.24), inset 0 0 30px rgba(178,108,255,.08)}}
  .eyebrow{color:var(--nblue);font-family:var(--sans);font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px;
    text-shadow:0 0 8px rgba(79,195,247,.65)}
  .qtext{font-size:20px;font-weight:600;line-height:1.4;font-family:var(--serif)}
  .atext{margin-top:12px;color:var(--nyellow);font-size:18px;font-weight:600;font-style:italic;text-shadow:0 0 10px rgba(255,213,74,.55);animation:apop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes apop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .cardtitle{font-family:var(--sans);font-size:30px;letter-spacing:.08em;text-transform:uppercase;line-height:1.05;color:var(--cream);
    text-shadow:0 0 10px rgba(255,244,224,.5),0 0 26px rgba(178,108,255,.5)}
  .cardtxt{margin-top:10px;font-size:16px;line-height:1.5}
  .hint{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.45;font-style:italic}

  .btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{flex:1;min-width:120px;background:rgba(18,8,33,.65);border:2px solid;border-radius:12px;padding:13px 12px;
    font-family:var(--sans);letter-spacing:.12em;font-size:18px;text-transform:uppercase;cursor:pointer;line-height:1;
    transition:transform .08s,box-shadow .2s;animation:btnhum 4.2s ease-in-out infinite alternate}
  @keyframes btnhum{from{filter:brightness(.96)}to{filter:brightness(1.08)}}
  button:active{transform:scale(.97)}
  .b-gold{border-color:var(--nyellow);color:var(--nyellow);text-shadow:0 0 8px rgba(255,213,74,.8);box-shadow:0 0 14px rgba(255,213,74,.35), inset 0 0 12px rgba(255,213,74,.12)}
  .b-mg{border-color:var(--norange);color:var(--norange);text-shadow:0 0 8px rgba(255,122,61,.8);box-shadow:0 0 14px rgba(255,122,61,.32), inset 0 0 12px rgba(255,122,61,.12)}
  .b-cy{border-color:var(--nblue);color:var(--nblue);text-shadow:0 0 8px rgba(79,195,247,.8);box-shadow:0 0 14px rgba(79,195,247,.32), inset 0 0 12px rgba(79,195,247,.12)}
  .b-rd{border-color:var(--nred);color:var(--nred);text-shadow:0 0 8px rgba(255,77,90,.8);box-shadow:0 0 14px rgba(255,77,90,.32), inset 0 0 12px rgba(255,77,90,.12)}
  .b-ghost{border-color:rgba(178,108,255,.4);color:var(--cream2);animation:none;box-shadow:none;text-shadow:none}
  .b-sm{flex:0 0 auto;min-width:0;padding:10px 14px;font-size:15px}
  .b-xs{flex:0 0 auto;min-width:0;padding:7px 10px;font-size:13px}

  /* ---------- dés ---------- */
  .dicewrap{display:flex;gap:16px;justify-content:center;margin:18px 0 6px}
  .die{width:64px;height:64px;border-radius:12px;background:rgba(18,8,33,.7);border:2px solid var(--cream);color:var(--cream);
    display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:36px;
    text-shadow:0 0 10px rgba(255,244,224,.8);box-shadow:0 0 16px rgba(255,244,224,.3), inset 0 0 12px rgba(255,244,224,.1)}
  .die.rolling{animation:shake .12s infinite}
  @keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
  .wheelres{margin-top:8px;text-align:center}
  .wheelres .big{font-family:var(--sans);font-size:28px;color:var(--norange);letter-spacing:.08em;text-transform:uppercase;
    text-shadow:0 0 10px rgba(255,122,61,.8),0 0 26px rgba(255,122,61,.4)}

  /* ---------- timer ---------- */
  .timer{font-family:var(--sans);font-size:56px;text-align:center;color:var(--nblue);margin:8px 0;font-variant-numeric:tabular-nums;letter-spacing:.06em;
    text-shadow:0 0 10px rgba(79,195,247,.85),0 0 30px rgba(79,195,247,.45)}
  .timer.hot{color:var(--nred);text-shadow:0 0 10px rgba(255,77,90,.9),0 0 32px rgba(255,77,90,.5);animation:pulse .5s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;background:rgba(10,4,20,.94);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:20px;padding:20px;text-align:center}
  #overlay.show{display:flex}
  .stamp{font-family:var(--sans);font-size:clamp(40px,12vw,76px);color:var(--nred);letter-spacing:.08em;line-height:1;text-transform:uppercase;
    border:4px solid var(--nred);border-radius:8px;padding:12px 24px 8px;transform:rotate(-7deg);
    text-shadow:0 0 8px rgba(255,77,90,.9),0 0 24px rgba(255,77,90,.55),0 0 52px rgba(255,77,90,.35);
    box-shadow:0 0 24px rgba(255,77,90,.4), inset 0 0 20px rgba(255,77,90,.15);
    animation:stampin .28s cubic-bezier(.2,1.6,.4,1),stglitch 2.6s steps(1) .5s infinite}
  .stamp.mk{color:var(--nyellow);border-color:var(--nyellow);
    text-shadow:0 0 8px rgba(255,213,74,.9),0 0 24px rgba(255,213,74,.55),0 0 52px rgba(255,213,74,.35);
    box-shadow:0 0 24px rgba(255,213,74,.4), inset 0 0 20px rgba(255,213,74,.15)}
  @keyframes stampin{from{transform:rotate(-7deg) scale(2.6);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
  @keyframes stglitch{0%,90%,100%{transform:rotate(-7deg)}91%{transform:rotate(-7deg) translateX(3px)}92%{transform:rotate(-7deg) translateX(-2px);opacity:.7}93%{transform:rotate(-7deg)}}
  #overlay .sub2{font-size:17px;color:var(--cream2);max-width:420px;line-height:1.5}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(10,4,20,.9);display:none;align-items:flex-end;justify-content:center;z-index:60}
  #modal.show{display:flex}
  #modal .sheet{background:var(--ink2);border-top:2px solid var(--nyellow);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:20px 16px 26px;
    box-shadow:0 -6px 30px rgba(255,213,74,.15)}
  #modal h3{font-family:var(--sans);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:22px;margin-bottom:12px;color:var(--cream);
    text-shadow:0 0 12px rgba(178,108,255,.6)}
  .mrow{display:flex;flex-direction:column;gap:8px}
  .mrow button{min-width:0}

  /* ---------- journal ---------- */
  #logwrap{position:fixed;bottom:0;left:0;right:0;background:rgba(18,8,33,.96);border-top:1.5px solid var(--line);padding:8px 14px 10px;max-height:36px;overflow:hidden;z-index:40;cursor:pointer;transition:max-height .2s;
    box-shadow:0 -4px 24px rgba(178,108,255,.15)}
  #logwrap.open{max-height:180px;overflow-y:auto}
  #logwrap::before{content:"▮ " attr(data-closed);display:block;font-family:var(--sans);font-size:11px;color:var(--nviolet);letter-spacing:.22em;margin-bottom:5px;
    text-shadow:0 0 8px rgba(178,108,255,.7);animation:cursorblink 1.2s steps(2,start) infinite}
  #logwrap.open::before{content:"▮ " attr(data-open)}
  @keyframes cursorblink{50%{opacity:.55}}
  #logwrap .lg{font-size:12.5px;color:var(--muted);line-height:1.5}
  #logwrap .lg b{color:var(--cream2)}
  #logwrap .lg:first-child{color:var(--cream)}
  #logwrap .lg:first-child b{color:var(--nyellow);text-shadow:0 0 6px rgba(255,213,74,.6)}
  .dare{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(37,21,67,.85);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px;line-height:1.35}
  .dare .dbt{display:flex;gap:5px;flex:0 0 auto}

  /* ---------- animations d'événements ---------- */
  .evt{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
  .evt-ico{font-size:84px;line-height:1;filter:drop-shadow(0 0 18px rgba(178,108,255,.7))}
  .evt-title{font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase;font-size:clamp(30px,8vw,52px);color:var(--nyellow);
    text-shadow:0 0 8px rgba(255,213,74,.9),0 0 26px rgba(255,213,74,.5),0 0 60px rgba(255,170,40,.35);
    animation:titlein .5s cubic-bezier(.2,1.6,.4,1) .25s both,signflick 7s linear 1.2s infinite}
  @keyframes titlein{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .evt.climb .evt-ico{animation:climb .9s cubic-bezier(.3,1.4,.4,1) both}
  @keyframes climb{0%{transform:translateY(90px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
  .evt.pond .evt-ico{animation:splash .8s ease-out both}
  @keyframes splash{0%{transform:translateY(-110px) scale(.5);opacity:0}60%{transform:translateY(0) scale(1.06);opacity:1}100%{transform:scale(1)}}
  .evt.pond::before,.evt.pond::after{content:"";position:absolute;top:8px;left:50%;width:110px;height:110px;margin-left:-55px;border:2px solid var(--nmint);border-radius:50%;opacity:0;
    box-shadow:0 0 12px rgba(77,230,168,.6);animation:ripple 1.6s ease-out .5s infinite}
  .evt.pond::after{animation-delay:1.1s}
  @keyframes ripple{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
  .evt.spin .evt-ico{animation:evspin .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes evspin{from{transform:rotate(-360deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
  .evt.pop .evt-ico{animation:evpop .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes evpop{from{transform:scale(0)}to{transform:scale(1)}}
  .evt.shake .evt-ico{animation:evshake .4s ease-in-out 2}
  @keyframes evshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .evt.glow .evt-ico{animation:glow 1.1s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.7;filter:drop-shadow(0 0 8px rgba(178,108,255,.5))}to{opacity:1;filter:drop-shadow(0 0 28px rgba(255,213,74,.9))}}
  .confetti{position:absolute;top:-20px;width:8px;height:14px;opacity:.95;animation:fall linear forwards;pointer-events:none;border-radius:1px;box-shadow:0 0 6px currentColor}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.5}}


  /* ============ ANIMATIONS PLATEAU TÉLÉ ============ */
  /* rampe d'ampoules qui court en haut de la carte active */
  .card.live{position:relative;overflow:hidden}
  .card.live::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:repeating-linear-gradient(90deg,var(--nyellow) 0 8px,transparent 8px 22px);
    background-size:22px 3px;filter:drop-shadow(0 0 5px var(--nyellow));
    animation:marquee 1.1s linear infinite;opacity:.85}
  @keyframes marquee{to{background-position:22px 0}}

  /* balayage de projecteur sur la carte de question */
  .card.live::after{content:"";position:absolute;top:-60%;left:-40%;width:45%;height:220%;
    background:linear-gradient(105deg,transparent,rgba(255,244,224,.09),transparent);
    transform:rotate(8deg);animation:sweep 5.5s ease-in-out infinite;pointer-events:none}
  @keyframes sweep{0%{left:-45%}55%,100%{left:125%}}

  /* entrée de plateau : la carte descend comme un panneau de décor */
  .drop-in{animation:dropIn .38s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes dropIn{from{transform:translateY(-18px) scale(.97);opacity:0}to{transform:none;opacity:1}}

  /* podium : flash de gain / de perte */
  .pod.win{animation:podWin .7s ease-out}
  .pod.lose{animation:podLose .7s ease-out}
  @keyframes podWin{0%{box-shadow:0 0 0 rgba(255,213,74,0)}25%{box-shadow:0 0 34px rgba(255,213,74,.95),inset 0 0 26px rgba(255,213,74,.4);transform:translateY(-5px) scale(1.03)}100%{box-shadow:0 0 14px rgba(178,108,255,.12)}}
  @keyframes podLose{0%{box-shadow:0 0 0 rgba(255,77,90,0)}20%{box-shadow:0 0 30px rgba(255,77,90,.9),inset 0 0 22px rgba(255,77,90,.35);transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{box-shadow:0 0 14px rgba(178,108,255,.12);transform:none}}

  /* jeton de points qui s'envole du podium */
  .fx-pts{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:9;
    font-family:var(--sans);font-size:26px;letter-spacing:.06em;pointer-events:none;white-space:nowrap;
    animation:ptsUp 1.15s cubic-bezier(.2,.9,.3,1) forwards}
  .fx-pts.up{color:var(--nyellow);text-shadow:0 0 10px rgba(255,213,74,.95),0 0 26px rgba(255,213,74,.6)}
  .fx-pts.down{color:var(--nred);text-shadow:0 0 10px rgba(255,77,90,.95),0 0 26px rgba(255,77,90,.6)}
  @keyframes ptsUp{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.6)}
    22%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.18)}
    38%{transform:translateX(-50%) translateY(0) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(.95)}}

  /* rampe de spots au-dessus du plateau (overlay d'événement) */
  #overlay.show::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 200deg at 50% -10%, transparent 0deg, rgba(255,213,74,.12) 18deg, transparent 36deg,
      transparent 60deg, rgba(79,195,247,.10) 78deg, transparent 96deg,
      transparent 120deg, rgba(255,122,61,.10) 138deg, transparent 156deg);
    animation:spots 6s linear infinite}

let LANG="fr";
const T=()=>I18N[LANG];
const D=()=>DATA[LANG];
function setLang(l){
  LANG=l;
  AI.q=[];AI.w=[];AI.seen=[];AI.err=false;
  if(S){S.usedQ=[];S.usedWQ=[];S.usedR=[];S.usedF=[];}
  const lb=document.getElementById("langbtn");if(lb)lb.textContent=T().lang;
  const sb=document.getElementById("subline");if(sb)sb.textContent=T().sub;
  const lw=document.getElementById("logwrap");lw.dataset.closed=T().logC;lw.dataset.open=T().logO;
  document.documentElement.lang=LANG;
  topUpAI();updAIBadge();
  if(S){
    if(S.phase==="question")drawQuestion();
    else if(S.phase==="wango"&&S.wango&&S.wango.state==="q"){S.wango.q=pickFresh(D().WQ,S.usedWQ);S.wango.showA=false}
    else if(S.phase==="ttt"||S.screen==="final"){S.q=pickFresh(D().Q,S.usedQ);S.showA=false}
    log(T().langSw);render();
  }else renderSetup();
}

/* =============== AI (Claude API) =============== */
const AI={on:true,diff:"normal",q:[],w:[],fq:false,fw:false,err:false,seen:[]};
function topUpAI(){if(!AI.on)return;
  if(AI.q.length<6&&!AI.fq)fetchAIQuestions();
  if(AI.w.length<4&&!AI.fw)fetchAIWango()}
function toggleAI(){AI.on=!AI.on;AI.err=false;if(AI.on)topUpAI();
  const b=document.getElementById("aibtn");if(b)b.textContent=T().aiL(AI.on);updAIBadge()}
function setDiff(d){AI.diff=d;AI.q=[];AI.seen=[];if(AI.on)topUpAI();
  document.querySelectorAll("#segdiff button").forEach(b=>b.classList.toggle("on",b.dataset.d===d));
  if(S&&S.screen!=="setup")render();updAIBadge()}
function diffShort(){return T().diffShort[AI.diff]}
function updAIBadge(){/* affichage volontairement désactivé */}
async function askClaude(prompt){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}
async function fetchAIQuestions(){
  AI.fq=true;updAIBadge();const lg=LANG;
  try{
    const diff=AI.diff==="facile"?(lg==="fr"?"facile":"easy"):AI.diff==="normal"?(lg==="fr"?"moyenne":"medium"):(lg==="fr"?"difficile":"hard");
    const prompt=lg==="fr"
      ?"Génère 8 questions de quiz MODERNES en FRANÇAIS pour un jeu d'ambiance : AU MOINS 6 questions sur 8 de pop culture (séries, films, animation, musique, jeux vidéo, réseaux sociaux, tech, sport actuel) ; les 2 autres de culture générale fun. Pas de dates d'histoire ancienne. Difficulté : "+diff+". Faits strictement exacts et vérifiables ; réponses courtes et sans ambiguïté. INTERDIT : les questions pièges, les questions dont la réponse est aucun, rien, non ou un mythe démenti, et les questions par oui/non. Chaque question doit avoir une réponse positive, précise et unique. Ne répète pas ces sujets : "+(AI.seen.slice(-30).join(" | ")||"aucun")+". Réponds UNIQUEMENT avec un tableau JSON valide, sans texte autour ni markdown : [{\"q\":\"question\",\"a\":\"réponse courte\"}]"
      :"Generate 8 MODERN quiz questions in ENGLISH for a party game: AT LEAST 6 of the 8 on pop culture (series, films, animation, music, video games, social media, tech, current sport); the other 2 fun general knowledge. No ancient-history dates. Difficulty: "+diff+". Strictly accurate, verifiable facts; short, unambiguous answers. FORBIDDEN: trick questions, questions whose answer is none, nothing, no or a debunked myth, and yes/no questions. Every question must have a positive, precise, single answer. Do not repeat these topics: "+(AI.seen.slice(-30).join(" | ")||"none")+". Reply ONLY with a valid JSON array, no surrounding text and no markdown: [{\"q\":\"question\",\"a\":\"short answer\"}]";
    const arr=await askClaude(prompt);
    if(lg===LANG)arr.forEach(o=>{if(o&&o.q&&o.a){AI.q.push([String(o.q),String(o.a)]);AI.seen.push(String(o.q).slice(0,60))}});
    AI.seen=AI.seen.slice(-40);AI.err=false;
  }catch(e){AI.err=true}
  AI.fq=false;updAIBadge();
}
async function fetchAIWango(){
  AI.fw=true;updAIBadge();const lg=LANG;
  try{
    const prompt=lg==="fr"
      ?"Génère 6 questions SPÉCIALES type « Wicked Wango » en FRANÇAIS pour un jeu télévisé parodique : réplique culte de film ou série à identifier, « épelle ce mot à l'envers », défi chrono « cite 3 X en 5 secondes », vrai/faux piégeux, devinette, défi où l'animateur mime ou fredonne. INTERDIT : paroles de chansons. Faits exacts ; réponses courtes ou « Validation de l'animateur ». Champ t = catégorie très courte en MAJUSCULES. Réponds UNIQUEMENT avec un tableau JSON valide sans markdown : [{\"t\":\"RÉPLIQUE CULTE\",\"x\":\"question\",\"ans\":\"réponse\"}]"
      :"Generate 6 SPECIAL \"Wicked Wango\" questions in ENGLISH for a parody game show: iconic film/TV line to identify, \"spell this word backwards\", 5-second rush challenges, tricky true/false, riddles, host-mimes-or-hums challenges. FORBIDDEN: song lyrics. Accurate facts; short answers or \"Host's call\". Field t = very short UPPERCASE category. Reply ONLY with a valid JSON array, no markdown: [{\"t\":\"ICONIC LINE\",\"x\":\"question\",\"ans\":\"answer\"}]";
    const arr=await askClaude(prompt);
    if(lg===LANG)arr.forEach(o=>{if(o&&o.x&&o.ans)AI.w.push({t:String(o.t||"WICKED WANGO"),x:String(o.x),ans:String(o.ans)})});
    AI.err=false;
  }catch(e){AI.err=true}
  AI.fw=false;updAIBadge();
}

/* =============== EXTRAITS SONORES (fichiers locaux de l'animateur) =============== */
const SND={clips:[],used:[]};
const AUD=new Audio();
function cleanName(f){
  return f.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").replace(/^\s*\d+[\s.)-]*/,"").trim();
}
function loadClips(ev){
  const files=[...(ev.target.files||[])];
  if(!files.length)return;
  SND.clips=files.map(f=>({name:cleanName(f.name),url:URL.createObjectURL(f)}));
  SND.used=[];
  const info=document.getElementById("sndinfo");
  if(info)info.textContent=T().sndOK(SND.clips.length);
}
function playClip(){if(!S||!S.sndUrl)return;try{AUD.src=S.sndUrl;AUD.currentTime=0;AUD.play()}catch(e){}}
function stopClip(){try{AUD.pause()}catch(e){}}
function goSound(){
  if(!SND.clips.length)return;
  if(SND.used.length>=SND.clips.length)SND.used=[];
  let i;do{i=Math.floor(Math.random()*SND.clips.length)}while(SND.used.includes(i));
  SND.used.push(i);
  const c=SND.clips[i];
  S.q=[T().sndQ,c.name];S.sndUrl=c.url;
  S.isSound=true;S.isRetro=false;S.isFriends=false;S.retroUsed=true;S.showA=false;
  render();playClip();
}

let S=null;
function newGame(names){
  S={screen:"game",players:names.map(n=>({name:n,score:0,angel:0,mudhut:0,hopping:0,dbl:false,streak:0,dares:[],lastGain:0})),
     cur:0,phase:"question",q:null,showA:false,isRetro:false,isFriends:false,isSound:false,sndUrl:null,retroUsed:false,bonus:null,
     usedQ:[],usedR:[],usedF:[],usedWQ:[],deckG:shuffle([...Array(DATA.fr.G.length).keys()]),wango:null,
     wangoDouble:false,turnGain:0,bonusQ:null,ttt:null,final:null,duel:null,lastB:[],log:[]};
  PREV=S.players.map(p=>p.score);
  log(T().first(cp().name));
  drawQuestion();render();
}
function cp(){return S.players[S.cur]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function log(m){S.log.unshift(m);S.log=S.log.slice(0,30);renderLog()}
function fmt(n){return n.toLocaleString(LANG==="fr"?"fr-FR":"en-US")}
function pick(bank,used){if(used.length>=bank.length)used.length=0;
  let i;do{i=Math.floor(Math.random()*bank.length)}while(used.includes(i));used.push(i);return bank[i]}

/* --- mémoire longue : une question déjà posée ne revient jamais, même après redémarrage --- */
const SEEN={key:"bamboozle.seen.v1",set:new Set()};
function seenLoad(){try{const r=localStorage.getItem(SEEN.key);if(r)SEEN.set=new Set(JSON.parse(r))}catch(e){}}
function seenSave(){try{localStorage.setItem(SEEN.key,JSON.stringify([...SEEN.set].slice(-4000)))}catch(e){}}
function qid(q){let h=0;const t=String(q).toLowerCase().replace(/\s+/g," ").trim();
  for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return h.toString(36)}
function seenMark(q){SEEN.set.add(qid(q));seenSave()}
function seenHas(q){return SEEN.set.has(qid(q))}
function resetSeen(){SEEN.set=new Set();seenSave();const e=document.getElementById("seeninfo");if(e)e.textContent=T().seenReset}
/* tire dans une banque en évitant tout ce qui a déjà été posé, ici ou lors d'une partie précédente */
function pickFresh(bank,used){
  const fresh=bank.map((v,i)=>i).filter(i=>!used.includes(i)&&!seenHas(bank[i][0]||bank[i].x));
  let i;
  if(fresh.length)i=fresh[Math.floor(Math.random()*fresh.length)];
  else{ // toute la banque a été vue : on repart d'un cycle neuf pour cette banque
    const cycle=bank.map((v,k)=>k).filter(k=>!used.includes(k));
    if(!cycle.length){used.length=0;return pickFresh(bank,used)}
    i=cycle[Math.floor(Math.random()*cycle.length)];
  }
  used.push(i);const item=bank[i];seenMark(item[0]||item.x);return item;
}

/* =============== QUESTIONS =============== */
function drawQuestion(){
  topUpAI();
  S.isRetro=false;S.isFriends=false;S.isSound=false;S.sndUrl=null;S.retroUsed=false;S.showA=false;stopClip();
  const bank=D().B,recent=S.lastB||[];
  const libres=bank.filter(x=>!recent.includes(x));
  S.bonus=(libres.length?libres:bank)[Math.floor(Math.random()*(libres.length?libres.length:bank.length))];
  S.lastB=[...recent,S.bonus].slice(-Math.min(6,bank.length-1));
  if(AI.on&&AI.q.length>0){while(AI.q.length&&seenHas(AI.q[0][0]))AI.q.shift();
    if(AI.q.length){S.q=AI.q.shift();seenMark(S.q[0]);updAIBadge();return}}
  S.q=pickFresh(D().Q,S.usedQ);
}
function goRetro(){S.q=pickFresh(D().R,S.usedR);S.isRetro=true;S.retroUsed=true;S.showA=false;sfx("reveal");render()}
function goFriends(){S.q=pickFresh(D().F,S.usedF);S.isFriends=true;S.isRetro=false;S.retroUsed=true;S.showA=false;sfx("reveal");render()}
function gainFor(p){
  let g=p.hopping>0?75:(p.mudhut>0?25:(S.isFriends?150:(S.isSound?100:(S.isRetro?75:50))));
  if(p.dbl)g*=2;
  return g;
}
function lossFor(p){return p.dbl?50:((S&&(S.isFriends||S.isSound))?50:25)}

/* Le VRAI Bamboozle : sanction rare et catastrophique (moitié des points). */
function triggerBamboozle(p,why){
  p.dbl=false;
  if(p.mudhut>0){
    log(T().bzSaved(why,p.name));
    S.bonusQ=null;endTurn();return;
  }
  const lost=Math.floor(p.score/2);p.score-=lost;
  log(T().bzHit(why,p.name,lost,fmt(p.score)));
  showStamp(T().bzStamp,T().bzSub(why,fmt(lost)),()=>{S.bonusQ=null;S.turnGain=0;endTurn()});
}

function answer(ok,bonus){ // bonus = défi du tour relevé (+50)
  stopClip();
  const p=cp();
  if(p.hopping>0)p.hopping--;
  if(ok){
    let g=gainFor(p)+(bonus?50:0);
    p.dbl=false;p.streak=0;
    p.score+=g;S.turnGain+=g;
    log(T().logOK(p.name,bonus,g,fmt(p.score)));
    if(S.bonusQ){S.bonusQ=null;endTurn();return}
    S.phase="action";render();
  }else{
    const L=lossFor(p);
    p.streak=(p.streak||0)+1;
    if(p.streak>=3){p.streak=0;triggerBamboozle(p,T().bz3);return}
    const applyLoss=()=>{
      p.dbl=false;
      p.score=Math.max(0,p.score-L);
      log(T().logMiss(p.name,L,fmt(p.score),p.streak));
      S.bonusQ=null;endTurn();
    };
    if(p.angel>0){
      askModal(T().angelQ(p.name),[
        {l:T().useA,c:"b-cy",f:()=>{p.angel--;p.dbl=false;log(T().angelUsed(p.name,p.streak));closeModal();S.bonusQ=null;endTurn()}},
        {l:T().takeP(L),c:"b-rd",f:()=>{closeModal();applyLoss()}}
      ]);
    }else applyLoss();
  }
}

/* =============== TOURS =============== */
function endTurn(){
  const p=cp();
  if(p.mudhut>0){p.mudhut--;if(p.mudhut===0)log(T().hutOut(p.name))}
  p.lastGain=S.turnGain;
  const q=S.players.findIndex(x=>x.score>=1000);
  if(q>=0){startFinal(q);return}
  S.cur=(S.cur+1)%S.players.length;S.turnGain=0;S.bonusQ=null;S.phase="question";
  if(cp().skip){cp().skip=false;log(T().skip(cp().name));S.cur=(S.cur+1)%S.players.length}
  const n=cp();
  log(T().turn(n.name,n.hopping));
  drawQuestion();render();
}

function spinWheel(){
  S.phase="wheel";render();sfx("roll");
  const d1=document.getElementById("d1"),d2=document.getElementById("d2");
  let t=0;const iv=setInterval(()=>{
    d1.textContent=1+Math.floor(Math.random()*6);
    d2.textContent=1+Math.floor(Math.random()*6);

      const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
      d1.textContent=a;d2.textContent=b;d1.classList.remove("rolling");d2.classList.remove("rolling");
      resolveWheel(a+b);
    }
  },90);
}
function resolveWheel(n){
  const w=D().WHEEL[String(n)],p=cp();
  log(T().whLog(n,w.t));
  const box=document.getElementById("wres");
  box.innerHTML='<div class="big">'+n+" — "+w.t+'</div><div class="cardtxt">'+w.x+'</div><div class="btnrow" id="wbtn"></div>';
  const B=document.getElementById("wbtn");
  const done=()=>endTurn();
  const btn=(l,c,f)=>{const b=document.createElement("button");b.className=c;b.textContent=l;b.onclick=f;B.appendChild(b)};
  switch(n){
    case 2:{const free=S.players.filter(x=>x.mudhut===0);
      if(free.length>1){const sc=free.map(x=>x.score);for(let i=0;i<free.length;i++)free[i].score=sc[(i-1+free.length)%free.length];
        log(T().mayLog);showEvent("🌪️",T().mayT,T().mayS,"spin",done)}
      else{log(T().maySafe);btn(T().cont,"b-gold",done)}break}
    case 3:showEvent("🌳⏱",T().tttGo,T().tttS,"glow",()=>startTTT());break;
    case 4:p.hopping=3;btn(T().hopGo,"b-gold",done);break;
    case 5:btn(T().r1,"b-cy",()=>{enterMudhut(1)});btn(T().r2,"b-cy",()=>{enterMudhut(2)});btn(T().r3,"b-cy",()=>{enterMudhut(3)});break;
    case 6:p.score+=100;S.turnGain+=100;log(T().spinB(p.name,fmt(p.score)));
      btn(T().spinBtn,"b-gold",()=>{S.bonusQ=true;S.phase="question";drawQuestion();render()});break;
    case 7:showStamp(T().mkT,T().mkS,done);break;
    case 8:if(p.angel<2){p.angel++;log(T().angGet(p.name,p.angel));
        showEvent("😇",T().angT,T().angS(p.name,p.angel),"pop",done)}
      else{log(T().angFull);btn(T().cont,"b-gold",done)}break;
    case 9:{drawQuestion();
      box.innerHTML+='<div class="card" style="margin-top:12px"><div class="eyebrow">'+T().bwEye+'</div><div class="qtext">'+S.q[0]+'</div><div class="atext">'+T().bwAns+S.q[1]+'</div><div class="btnrow"><button class="b-gold" onclick="bwOK(true)">'+T().bwOKb+'</button><button class="b-rd" onclick="bwOK(false)">'+T().bwKOb+'</button></div></div>';
      break}
    case 10:p.dbl=true;showEvent("✖️2",T().dblT,T().dblS(p.name),"shake",done);break;
    case 11:startDuel(null);break;
    case 12:p.score+=250;S.turnGain+=250;log(T().jackLog(p.name,fmt(p.score)));
      showEvent("👑",T().jackT,T().jackS(p.name),"spin",done,true);break;
  }
}
function bwOK(ok){const p=cp();
  if(ok){p.score+=150;S.turnGain+=150;p.streak=0;log(T().bwOK(p.name,fmt(p.score)))}
  else{p.score=Math.max(0,p.score-50);log(T().bwKO(p.name,fmt(p.score)))}
  endTurn();
}
function enterMudhut(n){const p=cp();p.mudhut=n+1;

function payMudhut(){const p=cp();if(p.score<75||p.mudhut>0)return;
  askModal(T().payQ,[
    {l:T().r1,c:"b-cy",f:()=>{closeModal();p.score-=75;enterMudhut(1)}},
    {l:T().r2,c:"b-cy",f:()=>{closeModal();p.score-=75;enterMudhut(2)}},

function actionWango(){S.wango={lvl:1,bank:0,state:"q",q:drawWQ(),showA:false};S.phase="wango";render()}

function wangoNext(){S.wango.lvl++;S.wango.state="q";S.wango.q=drawWQ();S.wango.showA=false;

function startDuel(after){
  S.duel={a:null,b:null,after:after||null,q:null,showA:false};
  S.phase="duel";render();
}
function duelPick(i){
  const d=S.duel;
  if(d.a===null){d.a=i}
  else if(d.b===null&&i!==d.a){d.b=i;d.q=pickFresh(D().Q,S.usedQ);d.showA=false;
    sfx("roll");showEvent("⚔️",T().duelT,T().duelS(S.players[d.a].name,S.players[d.b].name),"shake",()=>render());return}
  render();
}
function duelEnd(w){ // w = index du gagnant, ou null si personne
  const d=S.duel,A=S.players[d.a],B=S.players[d.b];
  if(w===null){log(T().duelNone(A.name,B.name))}
  else{
    const win=S.players[w],lose=S.players[w===d.a?d.b:d.a];
    win.score+=150;win.streak=0;
    if(lose.mudhut>0)log(T().duelHut(win.name,lose.name));
    else lose.score=Math.max(0,lose.score-50);
    log(T().duelWin(win.name,lose.name));
    showEvent("⚔️",T().duelWT(win.name),T().duelWS(win.name,lose.name),"spin",()=>{finishDuel()},true);
    return;
  }
  finishDuel();
}

  const after=S.duel?S.duel.after:null;S.duel=null;
  if(after)after();else endTurn();
}

function drawG(){if(S.deckG.length===0)S.deckG=shuffle([...Array(DATA.fr.G.length).keys()]);return D().G[S.deckG.pop()]}
function actionGoogle(){
  const dbl=S.wangoDouble;S.wangoDouble=false;
  const c=drawG();S.phase="card";S.card={deck:T().gT+(dbl?T().gDbl:""),c,dblPending:dbl};render();
  chooseGoogleTarget(c,dbl);
}
function chooseGoogleTarget(c,dbl){
  const B=document.getElementById("cardbtn");B.innerHTML="";
  if(c.k!=="dare"){renderGoogleButtons(c,dbl,cp());return}
  const others=S.players.map((x,i)=>({x,i})).filter(o=>o.i!==S.cur);
  if(others.length===1){log(T().gInf(cp().name,c.t,others[0].x.name));renderGoogleButtons(c,dbl,others[0].x);return}
  B.insertAdjacentHTML("beforebegin",'<div class="hint" id="wtgt">'+T().gWho+'</div>');
  others.forEach(o=>{const b=document.createElement("button");b.className="b-cy";b.textContent=o.x.name;b.onclick=()=>{
    const e=document.getElementById("wtgt");if(e)e.remove();
    log(T().gInf(cp().name,c.t,o.x.name));renderGoogleButtons(c,dbl,o.x)};B.appendChild(b)});
}
function renderGoogleButtons(c,dbl,t){
  const B=document.getElementById("cardbtn");B.innerHTML="";
  const next=()=>{if(dbl){const c2=drawG();S.card={deck:T().g2,c:c2,dblPending:false};render();chooseGoogleTarget(c2,false)}else endTurn()};
  const btn=(l,cl,f)=>{const b=document.createElement("button");b.className=cl;b.textContent=l;b.onclick=f;B.appendChild(b)};
  const p=cp();
  const withAngel=(v,q,eff)=>{
    if(v.angel>0){askModal(q,[
      {l:T().gCancel,c:"b-cy",f:()=>{v.angel--;log(T().gCancelLog(v.name));closeModal();next()}},
      {l:T().gTake,c:"b-rd",f:()=>{closeModal();eff()}}]);}
    else eff();
  };
  switch(c.k){
    case "dare":
      if(c.a==="dance"){
        btn(T().gDanceOK(t.name),"b-gold",()=>{t.score+=100;log(T().gDanceLog(t.name,fmt(t.score)));next()});
        btn(T().gSoul,"b-rd",()=>{log(T().gSoulLog);next()});
      }else if(c.a==="hop"){t.hopping=2;btn(T().gHop(t.name),"b-gold",next)}
      else{t.dares=(t.dares||[]);t.dares.push({t:c.t});
        btn(T().gDareB,"b-gold",()=>{log(T().gDareLog(t.name));next()})}
      break;
    case "adv":
      switch(c.fx){
        case "plus100":p.score+=100;S.turnGain+=100;log(T().gPlus(p.name,fmt(p.score)));btn(T().cont,"b-gold",next);break;
        case "dbl":p.dbl=true;btn(T().gDblB,"b-gold",next);break;
        case "hut":p.mudhut=3;log(T().hutFree(p.name));
          showEvent("🪜🛖",T().hutT,T().hutFreeS(p.name),"climb",next);break;
        case "angel":if(p.angel<2){p.angel++;log(T().angGet(p.name,p.angel));
            showEvent("😇",T().angT,T().angS(p.name,p.angel),"pop",next)}
          else{log(T().angFull2);btn(T().cont,"b-gold",next)}break;
        case "steal100":btn(T().gStealB,"b-mg",()=>pickTarget(T().gStealQ,true,(v)=>{
            withAngel(v,T().gTgt(v.name),()=>{const amt=Math.min(100,v.score);v.score-=amt;p.score+=amt;S.turnGain+=amt;
              log(T().gStealLog(p.name,amt,v.name));next()});}));break;
        case "skip":btn(T().gSkipB,"b-mg",()=>pickTarget(T().gSkipQ,false,(v)=>{
            v.skip=true;log(T().gSkipLog(v.name));next()}));break;
      }break;
    case "gimme":
      btn(T().gStealB,"b-mg",()=>{
        pickTarget(T().gimQ,true,(v)=>{
          const act=()=>{const amt=v.score;v.score=0;p.score+=amt;S.turnGain+=amt;
            log(T().gimLog(p.name,v.name,fmt(amt)));
            showEvent("💰",T().gimT,T().gimS(p.name,v.name,fmt(amt)),"shake",()=>endTurn(),true)};
          if(v.angel>0){askModal(T().gimTgt(v.name),[
            {l:T().gCancel,c:"b-cy",f:()=>{v.angel--;log(T().gimCancelLog(v.name));closeModal();endTurn()}},
            {l:T().gTake,c:"b-rd",f:()=>{closeModal();act()}}]);}
          else act();
        });
      });break;
    case "duel":btn(T().duelBtn,"b-rd",()=>startDuel(next));break;
    case "monkey":btn(T().mkBtn,"b-mg",()=>showStamp(T().mkT,T().mkS2,()=>endTurn()));break;
    case "dbl":S.wangoDouble=true;btn(T().slide,"b-cy",next);break;
    default:btn(T().cont,"b-gold",next);
  }
}

function dropConfetti(o){
  const cols=["#FFD54A","#FF7A3D","#4FC3F7","#FFF4E0","#FF4D5A","#4DE6A8"];
  for(let i=0;i<60;i++){const c=document.createElement("span");c.className="confetti";

/* =============== SON DE PLATEAU (WebAudio, aucun fichier) =============== */
const SFX={on:true,ctx:null};
function actx(){if(!SFX.ctx){try{SFX.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){SFX.on=false}}return SFX.ctx}
function tone(f,t0,dur,type,vol){
  const c=actx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t0);
  g.gain.setValueAtTime(0,c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.02);
}
function sfx(kind){
  if(!SFX.on)return;
  try{
    if(kind==="good"){tone(880,0,.14,"triangle");tone(1320,.09,.22,"triangle")}
    else if(kind==="bad"){tone(180,0,.32,"sawtooth",.13);tone(120,.05,.34,"sawtooth",.1)}
    else if(kind==="fanfare"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.15))}
    else if(kind==="doom"){[400,340,280,200].forEach((f,i)=>tone(f,i*.13,.4,"sawtooth",.12))}
    else if(kind==="roll"){for(let i=0;i<11;i++)tone(300+i*22,i*.085,.06,"square",.07)}
    else if(kind==="tick"){tone(1200,0,.04,"square",.06)}
    else if(kind==="reveal"){tone(660,0,.1,"sine",.1);tone(990,.07,.18,"sine",.1)}
  }catch(e){}
}
function toggleSFX(){SFX.on=!SFX.on;const b=document.getElementById("sfxbtn");if(b)b.textContent=SFX.on?"🔊":"🔇";if(SFX.on){actx();sfx("tick")}}

/* =============== EFFETS DE PLATEAU =============== */
let PREV=[];
function animScore(el,from,to){
  if(from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=Math.min(900,300+Math.abs(to-from)*1.6);
  const step=(t)=>{
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=fmt(Math.round(from+(to-from)*e));
    if(k<1)requestAnimationFrame(step);else el.textContent=fmt(to);
  };
  requestAnimationFrame(step);
}
function floatPts(pod,delta){
  const e=document.createElement("div");
  e.className="fx-pts "+(delta>0?"up":"down");
  e.textContent=(delta>0?"+":"−")+fmt(Math.abs(delta));
  pod.appendChild(e);setTimeout(()=>e.remove(),1300);
}

function renderLog(){document.getElementById("log").innerHTML=S.log.map(m=>'<div class="lg">'+m+'</div>').join("")}
function renderPodiums(){
  const el=document.getElementById("podiums");
  if(!S||S.screen==="setup"){el.innerHTML="";return}
  el.className=S.players.length>8?"n9":(S.players.length>4?"n5":"");
  el.innerHTML=S.players.map((p,i)=>{
    const b=[];
    if(p.angel>0)b.push('<span class="bdg cy">😇 ×'+p.angel+'</span>');
    if(p.mudhut>0)b.push('<span class="bdg gold">🛖 '+p.mudhut+'</span>');
    if(p.hopping>0)b.push('<span class="bdg mg">🦵 '+p.hopping+'</span>');
    if(p.dbl)b.push('<span class="bdg mg">×2</span>');
    if((p.dares||[]).length)b.push('<span class="bdg mg">🎭 '+p.dares.length+'</span>');
    if(p.skip)b.push('<span class="bdg rd">🔇</span>');
    if(p.streak>0)b.push('<span class="bdg rd">💥 '+p.streak+'/3</span>');
    return '<div class="pod '+(i===S.cur&&S.screen==="game"?"active":"")+'" onclick="podMenu('+i+')">'+
      '<div class="nm">'+p.name+'</div><div class="sc">'+fmt(p.score)+'</div><div class="badges">'+b.join("")+'</div></div>';
  }).join("");
  /* animation des variations de score */
  const pods=el.querySelectorAll(".pod");
  let bigGain=0,bigLoss=0;
  S.players.forEach((p,i)=>{
    const before=(PREV[i]===undefined)?p.score:PREV[i];
    if(before!==p.score&&pods[i]){
      const d=p.score-before;
      animScore(pods[i].querySelector(".sc"),before,p.score);
      floatPts(pods[i],d);
      pods[i].classList.add(d>0?"win":"lose");
      setTimeout(()=>{if(pods[i])pods[i].classList.remove("win","lose")},750);
      if(d>0)bigGain=Math.max(bigGain,d);else bigLoss=Math.max(bigLoss,-d);
    }
  });
  if(bigGain>=200)sfx("fanfare");else if(bigGain>0)sfx("good");
  if(bigLoss>=150)sfx("doom");else if(bigLoss>0)sfx("bad");
  PREV=S.players.map(p=>p.score);
}
