function renderPodiums(){
  const el=document.getElementById("podiums");
  if(!S||S.screen==="setup"){el.innerHTML="";return}
  el.className=S.players.length>8?"n9":(S.players.length>4?"n5":"");
  el.innerHTML=S.players.map((p,i)=>{
    const b=[];
    if(p.angel>0)b.push('<span class="bdg cy">😇 ×'+p.angel+'</span>');
    if(p.mudhut>0)b.push('<span class="bdg gold">🛖 '+p.mudhut+'</span>');
    if(p.hopping>0)b.push('<span class="bdg mg">🦵 '+p.hopping+'</span>');
    if(p.dbl)b.push('<span class="bdg mg">×2</span>');
    if((p.dares||[]).length)b.push('<span class="bdg mg">🎭 '+p.dares.length+'</span>');
    if(p.skip)b.push('<span class="bdg rd">🔇</span>');
    if(p.shield)b.push('<span class="bdg cy">🛡</span>');
    if(p.contract!==undefined&&p.contract!==null)b.push('<span class="bdg mg">📜</span>');
    if(p.streak>0)b.push('<span class="bdg rd">💥 '+p.streak+'/3</span>');
    if((p.combo||0)>=2)b.push('<span class="bdg fire">🔥 ×'+p.combo+'</span>');
    return '<div class="pod '+(i===S.cur&&S.screen==="game"?"active":"")+'" onclick="podMenu('+i+')">'+
      '<div class="nm">'+p.name+'</div><div class="sc">'+fmt(p.score)+'</div><div class="badges">'+b.join("")+'</div>'+
      '<div class="prog'+(p.score>=GOAL*0.75?" near":"")+'"><i style="width:'+Math.min(100,Math.round(p.score/GOAL*100))+'%"></i></div>'+
      '<div class="ladder">'+Array.from({length:LADDER},(_,k)=>{
         const r=k+1;return '<i class="'+(STATIONS[r]?"st ":"")+((p.rung||0)>=r?"on":"")+'"></i>'}).join("")+'</div></div>';
  }).join("");
  /* animation des variations de score */
  const pods=el.querySelectorAll(".pod");
  let bigGain=0,bigLoss=0;
  S.players.forEach((p,i)=>{
    const before=(PREV[i]===undefined)?p.score:PREV[i];
    if(before!==p.score&&pods[i]){
      const d=p.score-before;
      animScore(pods[i].querySelector(".sc"),before,p.score);
      floatPts(pods[i],d);
      pods[i].classList.add(d>0?"win":"lose");
      setTimeout(()=>{if(pods[i])pods[i].classList.remove("win","lose")},750);
      if(d>0)bigGain=Math.max(bigGain,d);else bigLoss=Math.max(bigLoss,-d);
    }
  });
  if(bigGain>=200)sfx("fanfare");else if(bigGain>0)sfx("good");
  if(bigLoss>=150)sfx("doom");else if(bigLoss>0)sfx("bad");
  /* Transition entre tours : illumine le nouveau, estompe l'ancien */
  if(PREV_CUR!==null&&S.cur!==PREV_CUR&&S.screen==="game"){
    const newPod=pods[S.cur],oldPod=pods[PREV_CUR];
    if(newPod){newPod.classList.add("entering");setTimeout(()=>newPod?.classList.remove("entering"),720);}
    if(oldPod&&oldPod!==newPod){oldPod.classList.add("receding");setTimeout(()=>oldPod?.classList.remove("receding"),620);}
  }
  PREV_CUR=S.cur;
  PREV=S.players.map(p=>p.score);
}

/* ---- Empilement bas d'écran : mesure dynamique via ResizeObserver ----
   Une seule source de vérité : la hauteur réelle de #logwrap est écrite
   dans --pile-bas, dont body dérive son padding-bottom. Pas de boucle de
   rétroaction possible : on observe #logwrap (position:fixed, sa hauteur
   ne dépend pas du padding du body). Fallback : var CSS initiale 96px si
   pas d'observer (ne dégrade pas l'affichage). */
(function initBottomPileObserver(){
  const el=document.getElementById("logwrap");if(!el)return;
  const root=document.documentElement.style;
  const write=()=>{const h=el.getBoundingClientRect().height;root.setProperty("--pile-bas",Math.ceil(h)+"px");};
  if(typeof ResizeObserver==="function"){
    const ro=new ResizeObserver(write);ro.observe(el);write();
  }else{
    root.setProperty("--pile-bas","220px");   /* fallback généreux */
    el.addEventListener("transitionend",write);
    window.addEventListener("resize",write);
  }
})();

/* ===== Anti double-tap global sur les boutons =====
   Un double-tap involontaire (mobile) ou un rebond de clic ne doit
   jamais déclencher deux fois la même action. Sur le MÊME bouton,
   tout second clic dans les 350 ms qui suivent le premier est ignoré.
   Capture-phase pour couper avant les onclick inline. */
(function installDoubleTapGuard(){
  const WINDOW_MS=350;
  const last=new WeakMap();
  document.addEventListener("click",function(e){
    const b=e.target&&e.target.closest?e.target.closest("button"):null;
    if(!b)return;
    const now=performance.now();
    const t=last.get(b)||0;
    if(now-t<WINDOW_MS){e.stopImmediatePropagation();e.preventDefault();return}
    last.set(b,now);
  },true);
})();

renderSetup();
/* Application iPhone : service worker = jeu disponible hors ligne (https ou localhost uniquement) */
/* App iPhone : écran toujours allumé pendant la soirée (le service worker est inutile, le jeu est embarqué) */
if(isNativeApp()){const K=Capacitor.Plugins&&Capacitor.Plugins.KeepAwake;if(K)K.keepAwake().catch(e=>console.warn("KeepAwake",e.message))}
else if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e.message))});
}

</script>
